    class Bullet extends Phaser.Physics.Arcade.Image {
      constructor(scene, x, y) {
        super(scene, x, y, 'bullet');
        this.damage = 0; this.isCrit = false; this.bounces = 0; this.life = 0;
      }

      fire(x, y, angle, speed, damage, isCrit, bounces, life) {
        this.enableBody(true, x, y, true, true);
        this.setScale(isCrit ? 1.35 : 1);
        this.body.setCircle(6, 6, 6);
        this.scene.physics.velocityFromRotation(angle, speed, this.body.velocity);
        this.setTint(isCrit ? C.magenta : 0xffffff);
        this.damage = damage; this.isCrit = isCrit; this.bounces = bounces; this.life = life;
        this.setDepth(12);
        this.setBlendMode(Phaser.BlendModes.ADD);
      }

      preUpdate(time, delta) {
        if (!this.active) return;
        this.life -= (delta / 1000) * this.scene.timeScale;
        if (this.life <= 0) { this.kill(); return; }
        // Manual wall handling so we can count ricochets. We only reflect when the bullet is
        // moving *outward*, which avoids double reflections without teleporting the body.
        const b = this.scene.bounds, v = this.body.velocity;
        if ((this.x < b.left && v.x < 0) || (this.x > b.right && v.x > 0)) {
          if (this.bounces-- > 0) v.x = -v.x; else { this.kill(); return; }
        }
        if ((this.y < b.top && v.y < 0) || (this.y > b.bottom && v.y > 0)) {
          if (this.bounces-- > 0) v.y = -v.y; else { this.kill(); return; }
        }
      }

      kill() { this.disableBody(true, true); }
    }

    class Enemy extends Phaser.Physics.Arcade.Sprite {
      constructor(scene, x, y) {
        super(scene, x, y, 'ghost');
        this.def = ENEMY_TYPES.ghost;
        this.hp = 1; this.maxHp = 1; this.speed = 0; this.dmg = 0;
        this.elite = false; this.flashT = 0; this.spawnT = 0; this.knockT = 0; this.phase = 0;
      }

      spawn(type, x, y, hpMult, speedMult, dmgMult, elite) {
        const def = ENEMY_TYPES[type];
        this.def = def;
        this.setTexture(def.tex);
        this.enableBody(true, x, y, true, true);
        const s = elite ? 1.65 : 1;
        this.setScale(s);
        this.body.setCircle(def.radius, 32 - def.radius, 32 - def.radius);
        this.elite = elite;
        this.maxHp = Math.ceil(def.hp * hpMult * (elite ? 8 : 1));
        this.hp = this.maxHp;
        this.speed = def.speed * speedMult * (elite ? 0.85 : 1) * rand(0.9, 1.1);
        this.dmg = def.dmg * dmgMult * (elite ? 1.5 : 1);
        this.flashT = 0; this.spawnT = 0; this.knockT = 0;
        this.phase = Math.random() * TAU;
        this.clearTint();
        this.setAlpha(0);
        this.setRotation(0);
        this.setDepth(elite ? 9 : 8);
      }

      /** Only deals contact damage after fading in: fair telegraphing of new spawns. */
      get harmful() { return this.spawnT > 0.35; }

      preUpdate(time, delta) {
        super.preUpdate(time, delta);
        if (!this.active) return;
        const scene = this.scene;
        const dt = (Math.min(delta, 50) / 1000) * scene.timeScale;
        const p = scene.player;

        this.spawnT += dt;
        const fade = Math.min(1, this.spawnT / 0.35);
        this.phase += dt * 6;

        if (this.flashT > 0) {
          this.flashT -= dt;
          if (this.flashT <= 0) this.clearTint();
        }

        if (this.knockT > 0) {
          this.knockT -= dt;
          this.body.velocity.scale(0.9);
        } else {
          const a = Math.atan2(p.y - this.y, p.x - this.x);
          let vx = Math.cos(a) * this.speed, vy = Math.sin(a) * this.speed;
          if (this.def.phasing) {
            // Ghosts drift in a lazy sine weave as they float through obstacles.
            const w = Math.sin(this.phase * 0.5) * this.speed * 0.35;
            vx += -Math.sin(a) * w; vy += Math.cos(a) * w;
          }
          this.body.setVelocity(vx, vy);
        }

        // Purely cosmetic animation (rotation/alpha never affect the arcade body).
        if (this.def.phasing) {
          this.setAlpha(fade * (0.72 + 0.2 * Math.sin(this.phase)));
        } else {
          this.setAlpha(fade);
          this.setRotation(Math.sin(this.phase * (this.def === ENEMY_TYPES.goblin ? 2.2 : 0.6)) * 0.14);
        }
      }

      /** Applies damage; returns true if this hit killed the enemy. */
      hurt(amount, angle) {
        this.hp -= amount;
        this.setTintFill(0xffffff);
        this.flashT = 0.06;
        if (!this.elite && this.def !== ENEMY_TYPES.blob) {
          this.body.setVelocity(Math.cos(angle) * 220, Math.sin(angle) * 220);
          this.knockT = 0.08;
        }
        return this.hp <= 0;
      }
    }

    class Pickup extends Phaser.Physics.Arcade.Image {
      constructor(scene, x, y) {
        super(scene, x, y, 'gem');
        this.value = 1; this.magnet = false; this.spin = 0; this.pull = 0; this.pulse = 0;
      }

      drop(x, y, value, texture) {
        this.setTexture(texture);
        this.enableBody(true, x, y, true, true);
        this.body.setCircle(10, 6, 6);
        this.value = value;
        this.magnet = false;
        this.pull = 0;
        this.pulse = Math.random() * TAU;
        this.spin = rand(-3, 3);
        this.setDepth(5);
        this.setScale(1);
        const a = Math.random() * TAU, sp = rand(60, 160);
        this.body.setVelocity(Math.cos(a) * sp, Math.sin(a) * sp);
        this.body.setDrag(380, 380);
      }

      preUpdate(time, delta) {
        if (!this.active) return;
        this.rotation += this.spin * delta / 1000;
        // Pulsating glow so loot always catches the eye.
        this.pulse += delta / 1000 * 7;
        const k = 1 + 0.18 * Math.sin(this.pulse);
        this.setScale(k);
        this.setAlpha(0.8 + 0.2 * Math.sin(this.pulse));
      }

      collect() { this.disableBody(true, true); }
    }

    // ------------------------------------------------------------------------------------
    // GAME (the run)
    // ------------------------------------------------------------------------------------
    class GameScene extends Phaser.Scene {
      constructor() { super('Game'); }

      init() {
        this.isGameOver = false;
        this.overlayOpen = false;
        this.elapsed = 0;
        this.kills = 0;
        this.runCoins = 0;
        this.level = 1;
        this.xp = 0;
        this.xpNext = xpForLevel(1);
        this.fireTimer = 0.4;
        this.invulnT = 0;
        this.aimAngle = -Math.PI / 2;
        this.cardStacks = {};
        this.vampKills = 0;
        this.hurtFlash = 0;
        this.saveTimer = 0;
        this.critShakeCd = 0;
        // Combo chain: kills within COMBO_WINDOW seconds of each other keep it alive.
        this.combo = 0;
        this.comboTimer = 0;
        this.bestCombo = 0;
        // Level-up "matrix" slow-motion: gameplay time scale ramps 1 -> ~0 before the draft opens.
        this.slowmo = null;
        this.timeScale = 1;
        this.director = {
          wave: 0, waveTimer: WAVE_LENGTH, spawnTimer: 1.2, spawnInterval: 1.35,
          hpMult: 1, speedMult: 1, dmgMult: 1, eliteTimer: 40,
        };
      }

      create() {
        const up = Save.data.upgrades;
        this.stats = {
          maxHealth: 100 + up.maxHp * 20,
          currentHealth: 0,
          speed: 230,
          damage: 10 * (1 + 0.15 * up.damage),
          critChance: Math.min(0.75, 0.05 + 0.04 * up.crit),
          critMult: 2,
          attackCooldown: 0.6,
          range: 460,
          projectileSpeed: 640,
          bounces: 0,
          extraShots: 0,
          vampiric: false,
          pickupRadius: 95,
        };
        this.stats.currentHealth = this.stats.maxHealth;

        this.bounds = new Phaser.Geom.Rectangle(ARENA.wall, ARENA.wall, ARENA.w - ARENA.wall * 2, ARENA.h - ARENA.wall * 2);
        this.physics.world.setBounds(this.bounds.x, this.bounds.y, this.bounds.width, this.bounds.height);

        this.buildArena();

        // Player
        this.player = this.physics.add.image(ARENA.w / 2, ARENA.h / 2, 'player').setDepth(10);
        this.player.body.setCircle(16, 16, 17);
        this.player.setCollideWorldBounds(true);
        this.halo = this.add.image(this.player.x, this.player.y, 'halo').setTint(C.cyan).setDepth(9).setBlendMode(Phaser.BlendModes.ADD);
        this.aim = this.add.image(this.player.x, this.player.y, 'aim').setDepth(11).setBlendMode(Phaser.BlendModes.ADD);

        // Pools
        this.bullets = this.physics.add.group({ classType: Bullet, maxSize: MAX_BULLETS, runChildUpdate: false });
        this.enemies = this.physics.add.group({ classType: Enemy, maxSize: MAX_ENEMIES, runChildUpdate: false, collideWorldBounds: true });
        this.gems = this.physics.add.group({ classType: Pickup, maxSize: MAX_GEMS, runChildUpdate: false });
        this.coins = this.physics.add.group({ classType: Pickup, maxSize: MAX_COINS, runChildUpdate: false });

        // Particle emitters (internally pooled by Phaser).
        const burst = (tint) => this.add.particles(0, 0, 'spark', {
          lifespan: { min: 220, max: 560 }, speed: { min: 60, max: 280 },
          scale: { start: 0.9, end: 0 }, alpha: { start: 1, end: 0 },
          blendMode: 'ADD', tint, emitting: false, maxAliveParticles: 350,
        }).setDepth(20);
        this.fx = {
          [C.crimson]: burst(C.crimson), [C.orange]: burst(C.orange), [C.ember]: burst(C.ember), [C.magenta]: burst(C.magenta),
          [C.cyan]: burst(C.cyan), [C.yellow]: burst(C.yellow),
        };

        // Shared per-frame overlay graphics (elite rings + HP bars).
        this.fxGfx = this.add.graphics().setDepth(15);
        // Neon ink trails behind every projectile, redrawn each frame in a single batch.
        this.trailGfx = this.add.graphics().setDepth(11).setBlendMode(Phaser.BlendModes.ADD);

        // Glowing motion trail behind the player while moving.
        this.playerTrail = this.add.particles(0, 0, 'spark', {
          lifespan: 320, speed: 0, frequency: 30, quantity: 1,
          scale: { start: 1.5, end: 0 }, alpha: { start: 0.6, end: 0 },
          tint: [C.cyan, 0xffffff], blendMode: 'ADD', emitting: false,
        }).setDepth(9);
        this.playerTrail.startFollow(this.player);

        // Pooled shockwave rings.
        this.rings = [];
        this.ringIdx = 0;
        for (let i = 0; i < 10; i++) {
          this.rings.push(this.add.image(0, 0, 'ring').setDepth(19).setVisible(false).setBlendMode(Phaser.BlendModes.ADD));
        }

        // Pooled floating combat text (FCT).
        this.popTexts = [];
        this.popIdx = 0;
        for (let i = 0; i < 32; i++) {
          const t = this.add.text(0, 0, '', {
            fontFamily: FONT_MONO, fontSize: '20px', color: '#ffffff', stroke: CSS.ink, strokeThickness: 5,
            padding: { x: 4, y: 4 },
          }).setOrigin(0.5).setDepth(30).setVisible(false);
          this.popTexts.push({ t, life: 0, age: 0, vx: 0, vy: 0, base: 1 });
        }

        // Collisions
        this.physics.add.collider(this.player, this.pillars);
        this.physics.add.collider(this.enemies, this.pillars, null, (a, b) => {
          const e = a instanceof Enemy ? a : b;
          return !e.def.phasing; // Ghosts float straight through obstacles.
        });
        this.physics.add.collider(this.enemies, this.enemies);
        this.physics.add.overlap(this.bullets, this.pillars, (a, b) => (a instanceof Bullet ? a : b).kill());
        this.physics.add.overlap(this.bullets, this.enemies, this.onBulletHit, null, this);
        this.physics.add.overlap(this.player, this.enemies, this.onPlayerTouch, null, this);
        this.physics.add.overlap(this.player, this.gems, this.onGem, null, this);
        this.physics.add.overlap(this.player, this.coins, this.onCoin, null, this);

        // Camera
        const cam = this.cameras.main;
        cam.setBounds(0, 0, ARENA.w, ARENA.h);
        cam.startFollow(this.player, false, 0.12, 0.12);
        cam.setBackgroundColor(C.ink);
        cam.fadeIn(300, 5, 7, 13);

        // Keyboard
        if (this.input.keyboard) {
          this.keys = this.input.keyboard.addKeys('W,A,S,D,UP,DOWN,LEFT,RIGHT');
          this.input.keyboard.on('keydown-ESC', () => this.requestPause());
          this.input.keyboard.on('keydown-P', () => this.requestPause());
        }

        this.setupJoystick();

        // Auto-pause when the tab is hidden or the window loses focus.
        this._onVisibility = () => { if (document.hidden) this.requestPause(); };
        document.addEventListener('visibilitychange', this._onVisibility);
        this.game.events.on(Phaser.Core.Events.BLUR, this.requestPause, this);

        this.events.on(Phaser.Scenes.Events.RESUME, this.onResume, this);
        this.events.once(Phaser.Scenes.Events.SHUTDOWN, this.cleanup, this);

        this.scene.launch('HUD');
        this.time.delayedCall(400, () => this.events.emit('banner', 'SURVIVE THE DOODLES!', CSS.cyan));
      }

      /** Removes every listener that outlives the scene (scene events, game events, DOM). */
      cleanup() {
        document.removeEventListener('visibilitychange', this._onVisibility);
        this.game.events.off(Phaser.Core.Events.BLUR, this.requestPause, this);
        this.events.off(Phaser.Scenes.Events.RESUME, this.onResume, this);
        if (Save.dirty) Save.persist();
        this.scene.stop('HUD');
      }

      buildArena() {
        const { w, h, wall } = ARENA;
        this.floor = this.add.tileSprite(0, 0, w, h, 'grid').setOrigin(0).setDepth(0);
        this.floorGlow = this.add.tileSprite(0, 0, w, h, 'grid_major').setOrigin(0).setDepth(1)
          .setBlendMode(Phaser.BlendModes.ADD).setAlpha(0.03);
        // Notebook margin line + punch holes.
        this.add.rectangle(wall + 140, 0, 3, h, C.crimson, 0.28).setOrigin(0).setDepth(1);
        for (let y = 260; y < h - 100; y += 420) this.add.circle(wall + 60, y, 18, C.ink, 1).setStrokeStyle(2.5, 0xffffff, 0.35).setDepth(1);

        // Walls: four tiled charcoal strips.
        this.add.tileSprite(0, 0, w, wall, 'wall_h').setOrigin(0).setDepth(2);
        this.add.tileSprite(0, h - wall, w, wall, 'wall_h').setOrigin(0).setDepth(2);
        this.add.tileSprite(0, wall, wall, h - wall * 2, 'wall_v').setOrigin(0).setDepth(2);
        this.add.tileSprite(w - wall, wall, wall, h - wall * 2, 'wall_v').setOrigin(0).setDepth(2);
        // Hand-drawn inner border, drawn once.
        const edge = this.add.graphics().setDepth(3);
        edge.lineStyle(10, 0xffffff, 0.04); edge.strokeRect(wall + 2, wall + 2, w - wall * 2 - 4, h - wall * 2 - 4);
        edge.lineStyle(4, 0xffffff, 0.8); sketchRect(edge, wall, wall, w - wall * 2, h - wall * 2, 2.5, 40);
        edge.lineStyle(2, 0xffffff, 0.3); sketchRect(edge, wall - 3, wall - 3, w - wall * 2 + 6, h - wall * 2 + 6, 3, 50);

        // Internal obstacles (static bodies). The arena centre is kept clear for the spawn.
        this.pillars = this.physics.add.staticGroup();
        const layout = [
          [0.2, 0.25], [0.5, 0.18], [0.8, 0.25],
          [0.28, 0.72], [0.72, 0.72], [0.5, 0.84],
          [0.12, 0.5], [0.88, 0.5],
        ];
        this.pillarRects = [];
        for (const [fx, fy] of layout) {
          const p = this.pillars.create(w * fx, h * fy, 'pillar').setDepth(4);
          p.setAngle(0);
          p.refreshBody();
          this.pillarRects.push(new Phaser.Geom.Rectangle(p.x - 70, p.y - 70, 140, 140));
        }
      }

      // ---------------- Joystick ----------------
      setupJoystick() {
        const restX = 160, restY = H - 160;
        this.joy = { id: -1, active: false, bx: restX, by: restY, restX, restY, vx: 0, vy: 0, r: 72 };
        const restAlpha = IS_TOUCH ? 0.35 : 0;
        this.joyBase = this.add.image(restX, restY, 'joy_base').setScrollFactor(0).setDepth(1000).setAlpha(restAlpha);
        this.joyKnob = this.add.image(restX, restY, 'joy_knob').setScrollFactor(0).setDepth(1001).setAlpha(restAlpha);
        this.input.on('pointerdown', this.onJoyDown, this);
        this.input.on('pointermove', this.onJoyMove, this);
        this.input.on('pointerup', this.onJoyUp, this);
        this.input.on('pointerupoutside', this.onJoyUp, this);
      }

      onJoyDown(p) {
        const j = this.joy;
        if (j.active || this.isGameOver) return;
        // Touch: the joystick lives on the left side; mouse can drag-steer from anywhere.
        if (p.wasTouch && p.x > W * 0.6) return;
        j.active = true; j.id = p.id;
        j.bx = p.x; j.by = p.y; j.vx = 0; j.vy = 0;
        this.joyBase.setPosition(p.x, p.y).setAlpha(0.8);
        this.joyKnob.setPosition(p.x, p.y).setAlpha(0.95);
      }

      onJoyMove(p) {
        const j = this.joy;
        if (!j.active || p.id !== j.id) return;
        let dx = p.x - j.bx, dy = p.y - j.by;
        const d = Math.hypot(dx, dy);
        if (d > j.r) {
          // Floating joystick: the base trails the finger so it never "runs out".
          j.bx = p.x - (dx / d) * j.r;
          j.by = p.y - (dy / d) * j.r;
          dx = p.x - j.bx; dy = p.y - j.by;
          this.joyBase.setPosition(j.bx, j.by);
        }
        this.joyKnob.setPosition(p.x, p.y);
        const m = Math.min(1, Math.hypot(dx, dy) / j.r);
        if (m < 0.12) { j.vx = 0; j.vy = 0; return; } // dead zone
        const a = Math.atan2(dy, dx);
        j.vx = Math.cos(a) * m; j.vy = Math.sin(a) * m;
      }

      onJoyUp(p) { if (p.id === this.joy.id) this.releaseJoystick(); }

      releaseJoystick() {
        const j = this.joy;
        j.active = false; j.id = -1; j.vx = 0; j.vy = 0;
        const restAlpha = IS_TOUCH ? 0.35 : 0;
        this.joyBase.setPosition(j.restX, j.restY).setAlpha(restAlpha);
        this.joyKnob.setPosition(j.restX, j.restY).setAlpha(restAlpha);
      }

      // ---------------- Pause / overlays ----------------
      requestPause() {
        if (this.isGameOver || this.overlayOpen || !this.scene.isActive()) return;
        this.overlayOpen = true;
        if (Save.dirty) Save.persist();
        this.scene.pause();
        this.scene.launch('Pause');
      }

      onResume() {
        this.overlayOpen = false;
        this.setTimeScale(1);
        this.cameras.main.zoomTo(1, 250, 'Sine.easeOut', true);
        this.releaseJoystick();
        if (this.input.keyboard) this.input.keyboard.resetKeys(); // key-ups were missed while paused
      }

      /** Gameplay time scale: slows physics, particles and every dt-driven timer together. */
      setTimeScale(ts) {
        this.timeScale = ts;
        // Arcade's fixed step: raising fps shrinks each step's simulated time, and timeScale = 1/ts keeps
        // the step cadence at the real 60 Hz. Net effect: smooth slow-motion instead of skipped steps.
        this.physics.world.setFPS(60 / ts);
        this.physics.world.timeScale = 1 / ts;
        for (const k in this.fx) this.fx[k].timeScale = ts;
        this.playerTrail.timeScale = ts;
      }

      /** Phase 1 of a level-up: a short "matrix" slow-motion dive before the draft pauses the game. */
      startLevelUpSlowmo() {
        this.overlayOpen = true;
        this.slowmo = { t: 0, dur: 0.6 };
        this.invulnT = Math.max(this.invulnT, 0.9);
        this.releaseJoystick();
        this.shockwave(this.player.x, this.player.y, C.cyan, 9, 600);
        this.fx[C.cyan].explode(36, this.player.x, this.player.y);
        this.cameras.main.zoomTo(1.15, 550, 'Sine.easeOut', true);
        this.events.emit('levelup-fx');
        Sfx.play('slowmo');
      }

      updateSlowmo(realDt) {
        const sm = this.slowmo;
        sm.t += realDt;
        const k = Math.min(1, sm.t / sm.dur);
        this.setTimeScale(Math.max(0.06, 1 - k * k * 0.94)); // ease-in towards near-frozen
        if (k >= 1) {
          this.slowmo = null;
          this.openLevelUp();
        }
      }

      /** Phase 2 of a level-up: pause the run and open the card draft. */
      openLevelUp() {
        this.overlayOpen = true;
        Sfx.play('level');
        const choices = this.draftCards(3).map((c) => ({ id: c.id, stack: this.cardStacks[c.id] || 0 }));
        this.scene.pause();
        this.scene.launch('LevelUp', { choices, level: this.level });
      }

      draftCards(n) {
        const pool = CARDS.filter((c) => (this.cardStacks[c.id] || 0) < c.max);
        Phaser.Utils.Array.Shuffle(pool);
        const picks = pool.slice(0, n);
        if (picks.length < n) picks.push(FILLER_CARD);
        return picks;
      }

      applyCard(id) {
        const card = CARD_BY_ID[id];
        if (!card) return;
        card.apply(this.stats, this);
        this.cardStacks[id] = (this.cardStacks[id] || 0) + 1;
        this.stats.currentHealth = Math.min(this.stats.currentHealth, this.stats.maxHealth);
      }

      // ---------------- Main loop ----------------
      update(time, delta) {
        const realDt = Math.min(delta, 50) / 1000; // clamp hitches so timers can't skip ahead
        if (this.slowmo) this.updateSlowmo(realDt);
        const dt = realDt * this.timeScale; // gameplay time (slowed during the level-up dive)

        this.floorGlow.setAlpha(0.03 + 0.02 * Math.sin(time / 700));
        this.updatePopTexts(dt);
        this.drawEliteFx();
        this.drawTrails();
        if (this.critShakeCd > 0) this.critShakeCd -= realDt;

        if (this.isGameOver) return;

        this.elapsed += dt;
        this.updatePlayer(dt);
        this.updateFiring(dt);
        this.updatePickups(dt);
        this.updateCombo(dt);
        if (!this.slowmo) this.updateDirector(dt);

        this.saveTimer += realDt;
        if (this.saveTimer > 2) { this.saveTimer = 0; if (Save.dirty) Save.persist(); }

        // Level-ups are handled at the end of the frame, never inside a physics callback.
        if (!this.overlayOpen && this.xp >= this.xpNext) {
          this.xp -= this.xpNext;
          this.level++;
          this.xpNext = xpForLevel(this.level);
          this.startLevelUpSlowmo();
        }
      }

      // ---------------- Combo chain ----------------
      addCombo() {
        this.combo++;
        this.comboTimer = COMBO_WINDOW;
        if (this.combo > this.bestCombo) this.bestCombo = this.combo;
        if (COMBO_MILESTONES.includes(this.combo)) this.comboMilestone(this.combo);
      }

      updateCombo(dt) {
        if (this.combo <= 0) return;
        this.comboTimer -= dt;
        if (this.comboTimer <= 0) {
          if (this.combo >= 10) this.popText(this.player.x, this.player.y - 50, `COMBO x${this.combo} ENDED`, CSS.dim, 18);
          this.combo = 0;
          this.comboTimer = 0;
        }
      }

      comboMilestone(n) {
        const color = n >= 50 ? C.magenta : n >= 25 ? C.cyan : C.yellow;
        this.events.emit('banner', `COMBO x${n}!`, hex(color));
        this.shockwave(this.player.x, this.player.y, color, 7, 500);
        this.fx[C.yellow].explode(30, this.player.x, this.player.y);
        this.cameras.main.shake(120, 0.006);
        Sfx.play('combo');
      }

      updatePlayer(dt) {
        const s = this.stats;
        let mx = 0, my = 0;
        const k = this.keys;
        if (k) {
          if (k.A.isDown || k.LEFT.isDown) mx -= 1;
          if (k.D.isDown || k.RIGHT.isDown) mx += 1;
          if (k.W.isDown || k.UP.isDown) my -= 1;
          if (k.S.isDown || k.DOWN.isDown) my += 1;
        }
        if (this.joy.active && (this.joy.vx || this.joy.vy)) { mx = this.joy.vx; my = this.joy.vy; }
        const len = Math.hypot(mx, my);
        if (len > 1) { mx /= len; my /= len; }
        // Arcade integrates velocity (px/s) with the frame delta, so movement is frame-rate independent.
        this.player.body.setVelocity(mx * s.speed, my * s.speed);
        this.player.setRotation(mx * 0.12);
        this.playerTrail.emitting = Math.hypot(mx, my) > 0.1;

        if (this.invulnT > 0) {
          this.invulnT -= dt;
          this.player.setAlpha(this.invulnT > 0 ? (Math.floor(this.invulnT * 20) % 2 ? 0.35 : 1) : 1);
        }
        if (this.hurtFlash > 0) this.hurtFlash = Math.max(0, this.hurtFlash - dt * 2.5);

        const ax = this.player.x + Math.cos(this.aimAngle) * 34;
        const ay = this.player.y + Math.sin(this.aimAngle) * 34;
        this.aim.setPosition(ax, ay).setRotation(this.aimAngle);
        this.halo.setPosition(this.player.x, this.player.y).setScale(1.25 + 0.1 * Math.sin(this.elapsed * 5)).setAlpha(0.55);
      }

      findTarget() {
        const px = this.player.x, py = this.player.y;
        let best = null, bestD = this.stats.range * this.stats.range;
        const list = this.enemies.getChildren();
        for (let i = 0; i < list.length; i++) {
          const e = list[i];
          if (!e.active) continue;
          const dx = e.x - px, dy = e.y - py, d = dx * dx + dy * dy;
          if (d < bestD) { bestD = d; best = e; }
        }
        return best;
      }

      updateFiring(dt) {
        this.fireTimer -= dt;
        if (this.fireTimer > 0) return;
        const target = this.findTarget();
        if (!target) { this.fireTimer = 0.05; return; }
        // Combo chains grant bonus attack speed.
        this.fireTimer = this.stats.attackCooldown / (1 + comboAtkBonus(this.combo));

        const s = this.stats;
        const a = Math.atan2(target.y - this.player.y, target.x - this.player.x);
        this.aimAngle = a;
        const n = 1 + s.extraShots;
        const spacing = 13;
        const cos = Math.cos(a), sin = Math.sin(a);
        const life = (s.range * 1.3 / s.projectileSpeed) * (1 + s.bounces * 0.7);
        for (let i = 0; i < n; i++) {
          const off = (i - (n - 1) / 2) * spacing;
          const b = this.bullets.get();
          if (!b) break; // pool exhausted: skip rather than allocate
          const crit = Math.random() < s.critChance;
          b.fire(
            this.player.x + cos * 18 - sin * off,
            this.player.y + sin * 18 + cos * off,
            a, s.projectileSpeed, s.damage * (crit ? s.critMult : 1), crit, s.bounces, life,
          );
        }
        Sfx.play('shoot', 0.07);
      }

      updatePickups(dt) {
        const px = this.player.x, py = this.player.y;
        const r2 = this.stats.pickupRadius * this.stats.pickupRadius;
        const pull = (group) => {
          const list = group.getChildren();
          for (let i = 0; i < list.length; i++) {
            const o = list[i];
            if (!o.active) continue;
            const dx = px - o.x, dy = py - o.y, d2 = dx * dx + dy * dy;
            if (!o.magnet && d2 < r2) {
              o.magnet = true;
              // Negative start = a tiny "hop" away before the vacuum kicks in.
              o.pull = -150;
              o.body.setDrag(0, 0);
            }
            if (o.magnet) {
              // Accelerating pull: slow at first, then a satisfying snap into the player.
              o.pull = Math.min(1800, o.pull + 2400 * dt);
              const d = Math.sqrt(d2) || 1;
              o.body.setVelocity((dx / d) * o.pull, (dy / d) * o.pull);
            }
          }
        };
        pull(this.gems);
        pull(this.coins);
      }

      // ---------------- Spawning director ----------------
      updateDirector(dt) {
        const d = this.director;

        d.waveTimer -= dt;
        if (d.waveTimer <= 0) {
          d.waveTimer += WAVE_LENGTH;
          d.wave++;
          d.spawnInterval = Math.max(0.22, d.spawnInterval * 0.84);
          d.hpMult *= 1.27;
          d.speedMult = Math.min(1.35, d.speedMult + 0.04);
          d.dmgMult += 0.1;
          this.events.emit('banner', `WAVE ${d.wave + 1} — THE DOODLES GROW STRONGER`, CSS.magenta);
          Sfx.play('wave');
          this.spawnElite();
        }

        d.eliteTimer -= dt;
        if (d.eliteTimer <= 0) {
          d.eliteTimer = Math.max(18, 45 - d.wave * 3);
          this.spawnElite();
        }

        d.spawnTimer -= dt;
        if (d.spawnTimer <= 0) {
          d.spawnTimer += d.spawnInterval;
          const count = Math.min(7, 1 + Math.floor(d.wave * 0.6) + (Math.random() < 0.3 ? 1 : 0));
          const pos = this.findSpawnPoint();
          for (let i = 0; i < count; i++) {
            this.spawnEnemy(this.pickEnemyType(), pos.x + rand(-45, 45), pos.y + rand(-45, 45), false);
          }
        }
      }

      pickEnemyType() {
        const w = this.director.wave;
        const table = [['ghost', 6], ['goblin', w >= 1 ? 4 : 2], ['blob', w >= 2 ? 2 + w * 0.3 : (w >= 1 ? 1 : 0)]];
        let total = 0;
        for (const [, wt] of table) total += wt;
        let r = Math.random() * total;
        for (const [k, wt] of table) { if ((r -= wt) < 0) return k; }
        return 'ghost';
      }

      findSpawnPoint() {
        const b = this.bounds, p = this.player;
        let x = 0, y = 0;
        for (let tries = 0; tries < 12; tries++) {
          const a = Math.random() * TAU, dist = rand(560, 820);
          x = clamp(p.x + Math.cos(a) * dist, b.left + 50, b.right - 50);
          y = clamp(p.y + Math.sin(a) * dist, b.top + 50, b.bottom - 50);
          const farEnough = Phaser.Math.Distance.Between(x, y, p.x, p.y) > 420;
          if (farEnough && !this.pillarRects.some((r) => r.contains(x, y))) break;
        }
        return { x, y };
      }

      spawnEnemy(type, x, y, elite) {
        const e = this.enemies.get();
        if (!e) return null; // at MAX_ENEMIES: the director simply waits
        const d = this.director;
        e.spawn(type, clamp(x, this.bounds.left + 30, this.bounds.right - 30), clamp(y, this.bounds.top + 30, this.bounds.bottom - 30),
          d.hpMult, d.speedMult, d.dmgMult, elite);
        return e;
      }

      spawnElite() {
        const types = ['ghost', 'goblin', 'blob'];
        const pos = this.findSpawnPoint();
        if (this.spawnEnemy(types[Math.floor(Math.random() * types.length)], pos.x, pos.y, true)) {
          this.events.emit('banner', 'ELITE INCOMING!', CSS.yellow);
        }
      }

      // ---------------- Combat ----------------
      onBulletHit(a, b) {
        const bullet = a instanceof Bullet ? a : b;
        const enemy = a instanceof Bullet ? b : a;
        if (!bullet.active || !enemy.active) return;
        const v = bullet.body.velocity;
        const angle = Math.atan2(v.y, v.x);
        const dmg = bullet.damage, crit = bullet.isCrit;
        bullet.kill();

        const dead = enemy.hurt(dmg, angle);
        if (crit) {
          this.popText(enemy.x, enemy.y - 20 * enemy.scale, `CRIT! ${Math.round(dmg)}`, CSS.magenta, 30, true);
          if (this.critShakeCd <= 0) { this.cameras.main.shake(100, 0.005); this.critShakeCd = 0.15; }
        } else {
          this.popText(enemy.x, enemy.y - 18 * enemy.scale, String(Math.round(dmg)), CSS.white, 20);
        }
        this.fx[C.cyan].explode(crit ? 8 : 3, bullet.x, bullet.y);
        Sfx.play(crit ? 'crit' : 'hit', 0.04);
        if (dead) this.killEnemy(enemy);
      }

      killEnemy(e) {
        this.kills++;
        const def = e.def;
        const emitter = this.fx[def.color] || this.fx[C.magenta];
        emitter.explode(e.elite ? 40 : 12, e.x, e.y);

        if (def === ENEMY_TYPES.blob) {
          // Blobs burst into a shower of small gems.
          const n = e.elite ? 12 : 4;
          for (let i = 0; i < n; i++) this.dropGem(e.x + rand(-14, 14), e.y + rand(-14, 14), 1);
        } else {
          this.dropGem(e.x, e.y, def.xp * (e.elite ? 6 : 1));
        }
        if (e.elite) {
          for (let i = 0; i < 5; i++) this.dropCoin(e.x + rand(-20, 20), e.y + rand(-20, 20));
          this.cameras.main.shake(160, 0.008);
          this.shockwave(e.x, e.y, C.yellow, 5, 450);
        } else if (Math.random() < def.coin) {
          this.dropCoin(e.x, e.y);
        }

        this.addCombo();

        if (this.stats.vampiric) {
          this.vampKills++;
          if (this.vampKills >= 10) {
            this.vampKills = 0;
            this.heal(this.stats.maxHealth * 0.1);
          }
        }

        e.disableBody(true, true);
        Sfx.play('kill', 0.05);
      }

      heal(amount) {
        const s = this.stats;
        const before = s.currentHealth;
        s.currentHealth = Math.min(s.maxHealth, s.currentHealth + amount);
        const gained = Math.round(s.currentHealth - before);
        if (gained > 0) this.popText(this.player.x, this.player.y - 34, '+' + gained, CSS.green, 22);
      }

      dropGem(x, y, value) {
        const g = this.gems.get();
        if (g) {
          g.drop(x, y, value, value >= 5 ? 'gem_big' : 'gem');
          return;
        }
        // Pool full: merge the value into an existing gem instead of allocating more objects.
        const list = this.gems.getChildren();
        const other = list[Math.floor(Math.random() * list.length)];
        if (other && other.active) {
          other.value += value;
          if (other.value >= 5) other.setTexture('gem_big');
        } else {
          this.xp += value;
        }
      }

      dropCoin(x, y) {
        const c = this.coins.get();
        if (c) c.drop(x, y, 1, 'coin');
        else this.addCoins(1); // pool full: credit directly
      }

      onPlayerTouch(player, enemy) {
        if (this.isGameOver || this.invulnT > 0 || !enemy.active || !enemy.harmful) return;
        const s = this.stats;
        s.currentHealth -= enemy.dmg;
        this.invulnT = 0.55;
        this.hurtFlash = 1; // HUD turns this into a neon-pink edge flash
        this.cameras.main.shake(100, 0.01);
        this.popText(player.x, player.y - 30, '-' + Math.round(enemy.dmg), CSS.magenta, 24);
        this.fx[C.magenta].explode(10, player.x, player.y);
        Sfx.play('hurt', 0.1);
        if (s.currentHealth <= 0) {
          s.currentHealth = 0;
          this.playerDie();
        }
      }

      onGem(player, gem) {
        if (!gem.active) return;
        this.xp += gem.value;
        gem.collect();
        Sfx.play('gem', 0.03);
      }

      onCoin(player, coin) {
        if (!coin.active) return;
        coin.collect();
        this.addCoins(coin.value);
        Sfx.play('coin', 0.06);
      }

      addCoins(n) {
        this.runCoins += n;
        Save.data.coins += n;  // persistent wallet, flushed to localStorage on a short timer
        Save.dirty = true;
      }

      playerDie() {
        this.isGameOver = true;
        this.releaseJoystick();
        this.player.body.setVelocity(0, 0);
        this.player.body.enable = false;
        this.player.setVisible(false);
        this.aim.setVisible(false);
        this.halo.setVisible(false);
        this.playerTrail.stop();
        this.combo = 0;
        this.fx[C.cyan].explode(60, this.player.x, this.player.y);
        this.fx[C.magenta].explode(40, this.player.x, this.player.y);
        this.cameras.main.shake(400, 0.015);
        this.cameras.main.flash(200, 255, 0, 85);
        Sfx.play('die');

        const best = Save.data.best;
        const newBest = Math.floor(this.elapsed) > best.time;
        best.time = Math.max(best.time, Math.floor(this.elapsed));
        best.kills = Math.max(best.kills, this.kills);
        best.level = Math.max(best.level, this.level);
        Save.data.runs++;
        Save.persist();

        const summary = { time: this.elapsed, kills: this.kills, coins: this.runCoins, level: this.level, bestCombo: this.bestCombo, newBest };
        this.time.delayedCall(1100, () => {
          this.cameras.main.fadeOut(300, 5, 7, 13);
          this.cameras.main.once(Phaser.Cameras.Scene2D.Events.FADE_OUT_COMPLETE, () => this.scene.start('GameOver', summary));
        });
      }

      // ---------------- FX helpers ----------------
      /**
       * Bouncy floating combat text: pops in oversized, hops upward, falls back slightly under
       * "gravity" and fades. Uses a fixed pool, so heavy combat never allocates.
       */
      popText(x, y, str, color, size, big = false) {
        const p = this.popTexts[this.popIdx];
        this.popIdx = (this.popIdx + 1) % this.popTexts.length;
        p.t.setText(str).setColor(color).setFontSize(size).setPosition(x + rand(-10, 10), y).setAlpha(1).setVisible(true);
        p.t.setDepth(big ? 31 : 30);
        p.life = big ? 0.9 : 0.7;
        p.age = 0;
        p.base = 1;
        p.big = big;
        p.vx = rand(-40, 40);
        p.vy = big ? -230 : -170;
      }

      updatePopTexts(dt) {
        for (const p of this.popTexts) {
          if (p.life <= 0) continue;
          p.life -= dt;
          p.age += dt;
          p.vy += 420 * dt; // gravity gives the hop its bounce
          p.t.x += p.vx * dt;
          p.t.y += p.vy * dt;
          const pop = Math.max(0, 1 - p.age / 0.14); // oversized for the first 140 ms
          p.t.setScale(p.base * (1 + pop * (p.big ? 1.1 : 0.6)));
          p.t.setAlpha(Math.min(1, p.life / 0.3));
          if (p.life <= 0) p.t.setVisible(false);
        }
      }

      /** Expanding neon ring from the pool. */
      shockwave(x, y, color, scaleTo, duration) {
        const r = this.rings[this.ringIdx];
        this.ringIdx = (this.ringIdx + 1) % this.rings.length;
        this.tweens.killTweensOf(r);
        r.setPosition(x, y).setTint(color).setScale(0.1).setAlpha(1).setVisible(true);
        this.tweens.add({
          targets: r, scale: scaleTo, alpha: 0, duration, ease: 'Cubic.easeOut',
          onComplete: () => r.setVisible(false),
        });
      }

      /** Short neon streak behind every live projectile (one Graphics, one draw call). */
      drawTrails() {
        const g = this.trailGfx;
        g.clear();
        const list = this.bullets.getChildren();
        for (let i = 0; i < list.length; i++) {
          const b = list[i];
          if (!b.active) continue;
          const v = b.body.velocity;
          const tx = b.x - v.x * 0.035, ty = b.y - v.y * 0.035;
          const col = b.isCrit ? C.magenta : C.cyan;
          g.lineStyle(7, col, 0.18); g.lineBetween(tx, ty, b.x, b.y);
          g.lineStyle(3, col, 0.6); g.lineBetween(tx, ty, b.x, b.y);
        }
      }

      drawEliteFx() {
        const g = this.fxGfx;
        g.clear();
        const list = this.enemies.getChildren();
        for (let i = 0; i < list.length; i++) {
          const e = list[i];
          if (!e.active || !e.elite) continue;
          const r = 34 * e.scale * 0.75;
          g.lineStyle(2, C.yellow, 0.35 + 0.25 * Math.sin(e.phase));
          g.strokeCircle(e.x, e.y, r + 4);
          const w = 54, pct = clamp(e.hp / e.maxHp, 0, 1);
          g.fillStyle(C.ink, 0.85); g.fillRect(e.x - w / 2, e.y - r - 16, w, 6);
          g.fillStyle(C.yellow, 1); g.fillRect(e.x - w / 2, e.y - r - 16, w * pct, 6);
        }
      }
    }

    // ------------------------------------------------------------------------------------
    // HUD (pinned to the screen; runs in parallel with Game)
    // ------------------------------------------------------------------------------------
    /**
     * Thick, fully-rounded glowing progress bar.
     * `trail` (0..1) draws a pale "recently lost" segment behind the main fill.
     */
    function glowBar(g, x, y, w, h, pct, color, trail = 0) {
      const r = h / 2;
      g.fillStyle(color, 0.07); g.fillRoundedRect(x - 7, y - 7, w + 14, h + 14, r + 7);
      g.fillStyle(color, 0.12); g.fillRoundedRect(x - 3, y - 3, w + 6, h + 6, r + 3);
      g.fillStyle(C.ink, 0.95); g.fillRoundedRect(x, y, w, h, r);
      const inset = 4, ih = h - inset * 2, iw = w - inset * 2, ir = ih / 2;
      const pill = (pw, col, a) => {
        if (pw < 1) return;
        g.fillStyle(col, a);
        g.fillRoundedRect(x + inset, y + inset, pw, ih, Math.min(ir, pw / 2));
      };
      if (trail > pct) pill(iw * trail, 0xffffff, 0.5);
      pill(iw * pct, color, 1);
      // Glossy highlight along the top of the fill.
      const hw = iw * pct - ir * 1.2;
      if (hw > 2) {
        g.fillStyle(0xffffff, 0.4);
        g.fillRoundedRect(x + inset + ir * 0.6, y + inset + ih * 0.14, hw, ih * 0.26, Math.min(ih * 0.13, hw / 2));
      }
      g.lineStyle(3, color, 0.95); g.strokeRoundedRect(x, y, w, h, r);
    }

    class HUDScene extends Phaser.Scene {
      constructor() { super('HUD'); }

      create() {
        this.gs = this.scene.get('Game');
        // Heavy dark vignette (always on) + pink damage vignette (pulses on hits / low HP).
        this.add.image(W / 2, H / 2, 'vignette_dark').setDisplaySize(W, H);
        this.vignette = this.add.image(W / 2, H / 2, 'vignette').setDisplaySize(W, H).setAlpha(0);
        this.g = this.add.graphics();

        // --- Player panel (top-left): level badge, HP bar, XP bar ---
        this.badge = { x: 62, y: 60, r: 36 };
        this.lvlLabel = neonText(this, 62, 42, 'LV', 15, CSS.cyan, { mono: true, glow: 6 });
        this.lvlText = neonText(this, 62, 66, '', 34, CSS.white, { glow: 14 });
        this.hpText = neonText(this, 118 + 170, 45, '', 17, CSS.white, { mono: true, glow: 0, strokeThickness: 4 });
        this.xpText = neonText(this, 118 + 170, 82, '', 13, CSS.white, { mono: true, glow: 0, strokeThickness: 3 });

        // --- Run clock (top-centre) ---
        this.timeText = neonText(this, W / 2, 42, '', 42, CSS.white, { mono: true, glow: 10 });
        this.waveText = neonText(this, W / 2, 84, '', 16, CSS.crimson, { mono: true, glow: 8 });

        // --- Wallet + kills (top-right) ---
        this.coinIcon = this.add.image(W - 296, 44, 'coin').setScale(1.5);
        this.coinText = neonText(this, W - 274, 44, '', 28, CSS.yellow, { mono: true, ox: 0, glow: 12 });
        this.killText = neonText(this, W - 223, 92, '', 16, CSS.white, { mono: true, glow: 0 });

        new NeonButton(this, W - 56, 46, 64, 58, 'II', C.cyan, () => this.gs.requestPause(), 26);

        this.banner = neonText(this, W / 2, 170, '', 44, CSS.magenta, { glow: 20 }).setAlpha(0);

        // --- Combo meter (right edge). Hidden while there is no chain. ---
        this.comboGfx = this.add.graphics();
        this.comboLabel = neonText(this, W - 40, 250, 'COMBO', 20, CSS.yellow, { mono: true, ox: 1, glow: 8 });
        this.comboText = neonText(this, W - 40, 302, '', 68, CSS.yellow, { ox: 1, glow: 22 });
        this.comboBonus = neonText(this, W - 40, 356, '', 16, CSS.white, { mono: true, ox: 1, glow: 0 });
        this.comboGroup = [this.comboLabel, this.comboText, this.comboBonus];
        this.comboGroup.forEach((o) => o.setAlpha(0));

        // Full-screen flash + scanlines used for the level-up dive.
        this.flash = this.add.rectangle(0, 0, W, H, C.cyan, 0).setOrigin(0).setBlendMode(Phaser.BlendModes.ADD);
        this.scan = this.add.graphics().setAlpha(0);
        for (let y = 0; y < H; y += 6) { this.scan.fillStyle(C.cyan, 0.08); this.scan.fillRect(0, y, W, 2); }

        // Animated display state: values ease toward the truth, "punch" values decay to 0.
        this.dispHp = 1;
        this.dispXp = 0;
        this.comboAlpha = 0;
        this.comboPunch = 0;
        this.lastCombo = 0;
        this.coinPunch = 0;
        this.lastCoins = 0;
        this.lvlPunch = 0;
        this.lastLevel = 1;
        this.hpPunch = 0;
        this.lastHp = this.gs.stats.currentHealth;
        this.cache = {};

        this.gs.events.on('banner', this.showBanner, this);
        this.gs.events.on('levelup-fx', this.levelUpFx, this);
        this.events.once(Phaser.Scenes.Events.SHUTDOWN, () => {
          this.gs.events.off('banner', this.showBanner, this);
          this.gs.events.off('levelup-fx', this.levelUpFx, this);
        });
      }

      levelUpFx() {
        this.tweens.killTweensOf([this.flash, this.scan]);
        this.flash.setFillStyle(C.cyan, 0.35);
        this.tweens.add({ targets: this.flash, fillAlpha: 0, duration: 500, ease: 'Quad.easeOut' });
        this.scan.setAlpha(1);
        this.tweens.add({ targets: this.scan, alpha: 0, duration: 900, delay: 200 });
        this.showBanner('LEVEL UP!', CSS.cyan);
      }

      /** Banner slams in oversized, settles with an elastic wobble, then fades out. */
      showBanner(text, color) {
        this.tweens.killTweensOf(this.banner);
        this.banner.setText(text).setColor(color).setShadow(0, 0, color, 20, true, true).setAlpha(0).setScale(2.2).setAngle(-4);
        this.tweens.add({ targets: this.banner, alpha: 1, scale: 1, angle: 0, duration: 420, ease: 'Elastic.easeOut', easeParams: [1.1, 0.5] });
        this.tweens.add({ targets: this.banner, alpha: 0, scale: 0.85, delay: 1700, duration: 380, ease: 'Quad.easeIn' });
      }

      /** Only re-render a Text when its string actually changed (Text re-rasterises on setText). */
      set(key, textObj, str) {
        if (this.cache[key] !== str) { this.cache[key] = str; textObj.setText(str); }
      }

      update(time, delta) {
        const gs = this.gs;
        if (!gs || !gs.stats) return;
        const s = gs.stats;
        const k = Math.min(1, delta / 140); // easing factor for animated readouts
        const decay = delta / 260;

        // --- Animated state ---
        const hpPct = clamp(s.currentHealth / s.maxHealth, 0, 1);
        const xpPct = clamp(gs.xp / gs.xpNext, 0, 1);
        this.dispHp += (hpPct - this.dispHp) * Math.min(1, delta / 400); // slow drain = readable damage
        if (this.dispHp < hpPct) this.dispHp = hpPct;
        if (xpPct < this.dispXp - 0.5) this.dispXp = 0; // wrapped after a level-up
        this.dispXp += (xpPct - this.dispXp) * k;

        if (s.currentHealth < this.lastHp) this.hpPunch = 1;
        this.lastHp = s.currentHealth;
        if (gs.runCoins > this.lastCoins) this.coinPunch = 1;
        this.lastCoins = gs.runCoins;
        if (gs.level > this.lastLevel) this.lvlPunch = 1;
        this.lastLevel = gs.level;
        this.hpPunch = Math.max(0, this.hpPunch - decay);
        this.coinPunch = Math.max(0, this.coinPunch - decay);
        this.lvlPunch = Math.max(0, this.lvlPunch - decay * 0.6);

        const g = this.g;
        g.clear();

        // --- Level badge ---
        const b = this.badge, br = b.r * (1 + this.lvlPunch * 0.3);
        g.fillStyle(C.cyan, 0.08 + 0.05 * Math.sin(time / 300)); g.fillCircle(b.x, b.y, br + 10);
        g.fillStyle(C.cyan, 0.14); g.fillCircle(b.x, b.y, br + 4);
        g.fillStyle(C.ink, 0.95); g.fillCircle(b.x, b.y, br);
        g.lineStyle(4, C.cyan, 1); g.strokeCircle(b.x, b.y, br);
        // XP progress ring around the badge.
        if (this.dispXp > 0.01) {
          g.lineStyle(4, C.yellow, 0.9);
          g.beginPath(); g.arc(b.x, b.y, br + 7, -Math.PI / 2, -Math.PI / 2 + TAU * this.dispXp, false); g.strokePath();
        }
        this.lvlText.setScale(1 + this.lvlPunch * 0.6);

        // --- HP + XP bars (shake briefly when hit) ---
        const shake = this.hpPunch * Math.sin(time * 0.09) * 5;
        glowBar(g, 118 + shake, 30, 340, 30, hpPct, C.crimson, this.dispHp);
        glowBar(g, 118, 72, 340, 20, this.dispXp, C.yellow);
        this.hpText.setX(118 + 170 + shake).setScale(1 + this.hpPunch * 0.25);

        // --- Wave pill + wallet pill ---
        g.fillStyle(C.ink, 0.85); g.fillRoundedRect(W / 2 - 62, 72, 124, 26, 13);
        g.lineStyle(2, C.crimson, 0.7); g.strokeRoundedRect(W / 2 - 62, 72, 124, 26, 13);
        g.fillStyle(C.yellow, 0.08); g.fillRoundedRect(W - 330, 16, 214, 56, 28);
        g.fillStyle(C.ink, 0.9); g.fillRoundedRect(W - 326, 20, 206, 48, 24);
        g.lineStyle(3, C.yellow, 0.9); g.strokeRoundedRect(W - 326, 20, 206, 48, 24);
        const cp = 1 + this.coinPunch * 0.45;
        this.coinIcon.setScale(1.5 * cp);
        this.coinText.setScale(1 + this.coinPunch * 0.3);

        this.set('lvl', this.lvlText, String(gs.level));
        this.set('hp', this.hpText, `${Math.ceil(s.currentHealth)} / ${Math.round(s.maxHealth)}`);
        this.set('xp', this.xpText, `${Math.floor(gs.xp)} / ${gs.xpNext} XP`);
        this.set('time', this.timeText, fmtTime(gs.elapsed));
        this.set('wave', this.waveText, `WAVE ${gs.director.wave + 1}`);
        this.set('coin', this.coinText, String(gs.runCoins));
        this.set('kill', this.killText, `${gs.kills} KILLS`);

        this.updateCombo(gs, delta);

        // Damage flash + low-health pulse (neon pink screen edges).
        let va = gs.hurtFlash * 0.75;
        if (hpPct < 0.3 && !gs.isGameOver) va = Math.max(va, (0.3 + 0.2 * Math.sin(time / 140)) * (1 - hpPct / 0.3));
        this.vignette.setAlpha(va);
      }

      /** Combo meter: fades in with a chain, punch-scales on each kill, thick timer bar drains. */
      updateCombo(gs, delta) {
        const combo = gs.combo;
        if (combo > this.lastCombo) this.comboPunch = 1;
        this.lastCombo = combo;
        const target = combo > 1 ? 1 : 0;
        this.comboAlpha += (target - this.comboAlpha) * Math.min(1, delta / 120);
        this.comboPunch = Math.max(0, this.comboPunch - delta / 220);

        const color = combo >= 50 ? CSS.magenta : combo >= 25 ? CSS.cyan : CSS.yellow;
        const colNum = combo >= 50 ? C.magenta : combo >= 25 ? C.cyan : C.yellow;
        if (this.cache.comboCol !== color) {
          this.cache.comboCol = color;
          this.comboText.setColor(color).setShadow(0, 0, color, 22, true, true);
          this.comboLabel.setColor(color).setShadow(0, 0, color, 8, true, true);
        }
        if (combo > 1) {
          this.set('combo', this.comboText, 'x' + combo);
          this.set('comboBonus', this.comboBonus, `+${Math.round(comboAtkBonus(combo) * 100)}% ATK SPEED`);
        }
        // Squash-and-stretch punch on each new kill.
        const p = this.comboPunch;
        this.comboText.setScale(1 + p * 0.55, 1 + p * 0.3).setAngle(-6 + p * 10);
        this.comboGroup.forEach((o) => o.setAlpha(this.comboAlpha));

        const g = this.comboGfx;
        g.clear();
        if (this.comboAlpha > 0.02) {
          g.setAlpha(this.comboAlpha);
          glowBar(g, W - 40 - 190, 374, 190, 16, clamp(gs.comboTimer / COMBO_WINDOW, 0, 1), colNum);
        }
      }
    }

    // ------------------------------------------------------------------------------------
    // LEVEL-UP DRAFT
    // ------------------------------------------------------------------------------------
    class LevelUpScene extends Phaser.Scene {
      constructor() { super('LevelUp'); }

      init(data) {
        this.choices = (data && data.choices) || [];
        this.level = (data && data.level) || 1;
      }

      create() {
        this.gs = this.scene.get('Game');
        this.ready = false;
        this.done = false;
        const blocker = addBlocker(this, 0).setFillStyle(C.ink, 0);
        this.tweens.add({ targets: blocker, fillAlpha: 0.8, duration: 250 });

        this.buildMatrixRain();

        const title = neonText(this, W / 2, 110, 'LEVEL UP!', 76, CSS.cyan, { glow: 26 }).setScale(2.2).setAlpha(0);
        this.tweens.add({ targets: title, scale: 1, alpha: 1, duration: 380, ease: 'Back.easeOut' });
        this.tweens.add({ targets: title, scale: 1.05, duration: 700, delay: 400, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
        neonText(this, W / 2, 172, `LEVEL ${this.level}  —  pick one upgrade`, 22, CSS.white, { mono: true, glow: 0 });

        const n = this.choices.length;
        const spacing = 350;
        this.cards = this.choices.map((ch, i) => this.buildCard(ch, W / 2 + (i - (n - 1) / 2) * spacing, 420, i));

        neonText(this, W / 2, 670, IS_TOUCH ? 'TAP A CARD' : 'CLICK A CARD  •  OR PRESS 1 / 2 / 3', 16, CSS.dim, { mono: true, glow: 0 });

        if (this.input.keyboard) {
          ['ONE', 'TWO', 'THREE'].forEach((k, i) => this.input.keyboard.on('keydown-' + k, () => this.pick(i)));
        }
        // Input unlocks once every card has flipped face-up, so an in-flight tap can't misfire.
        this.time.delayedCall(FLIP_START + n * FLIP_STAGGER + 260, () => { this.ready = true; });
      }

      /** "Matrix" rain: a column of glyphs per lane, recycled when it leaves the screen. */
      buildMatrixRain() {
        const glyphs = '01<>/\\#$%&*+=?ABCDEFXYZ@';
        const column = this.rainColumn = () => {
          let str = '';
          const len = Phaser.Math.Between(8, 18);
          for (let i = 0; i < len; i++) str += glyphs[Math.floor(Math.random() * glyphs.length)] + '\n';
          return str;
        };
        this.rain = [];
        for (let x = 20; x < W; x += 44) {
          const t = this.add.text(x, rand(-H, 0), column(), {
            fontFamily: FONT_MONO, fontSize: '18px', color: Math.random() < 0.2 ? CSS.magenta : CSS.cyan, lineSpacing: -2,
          }).setOrigin(0.5, 1).setAlpha(0);
          this.tweens.add({ targets: t, alpha: rand(0.12, 0.3), duration: 300 });
          this.rain.push({ t, speed: rand(160, 420) });
        }
      }

      update(time, delta) {
        const dt = Math.min(delta, 50) / 1000;
        for (const r of this.rain) {
          r.t.y += r.speed * dt;
          if (r.t.y - r.t.height > H) {
            r.t.setText(this.rainColumn());
            r.t.y = rand(-120, 0);
          }
        }
      }

      buildCard(choice, x, y, index) {
        const card = CARD_BY_ID[choice.id];
        const w = 310, h = 400;
        const c = this.add.container(x, y + 80).setAlpha(0);

        // --- Back face: a doodled notebook card with a big "?" ---
        const back = this.add.graphics();
        back.fillStyle(C.paper, 1); back.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
        back.lineStyle(1, C.cyan, 0.12);
        for (let gx = -w / 2 + 20; gx < w / 2; gx += 20) back.lineBetween(gx, -h / 2 + 6, gx, h / 2 - 6);
        for (let gy = -h / 2 + 20; gy < h / 2; gy += 20) back.lineBetween(-w / 2 + 6, gy, w / 2 - 6, gy);
        back.lineStyle(12, C.cyan, 0.1); back.strokeRoundedRect(-w / 2, -h / 2, w, h, 18);
        back.lineStyle(3, C.cyan, 0.9); back.strokeRoundedRect(-w / 2, -h / 2, w, h, 18);
        const q = neonText(this, 0, 0, '?', 150, CSS.cyan, { glow: 24 });
        const backParts = [back, q];

        // --- Front face ---
        const g = this.add.graphics();
        const draw = (hover) => {
          g.clear();
          g.fillStyle(C.ink, 0.95); g.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
          g.fillStyle(card.color, hover ? 0.16 : 0.07); g.fillRoundedRect(-w / 2, -h / 2, w, h, 18);
          g.lineStyle(14, card.color, hover ? 0.22 : 0.08); g.strokeRoundedRect(-w / 2, -h / 2, w, h, 18);
          g.lineStyle(4, card.color, 1); g.strokeRoundedRect(-w / 2, -h / 2, w, h, 18);
          g.lineStyle(1, card.color, 0.4); g.lineBetween(-w / 2 + 24, -10, w / 2 - 24, -10);
        };
        draw(false);
        const icon = this.add.image(0, -120, card.icon).setScale(1.7);
        const name = neonText(this, 0, -44, card.name, 30, hex(card.color), { wrap: w - 30 });
        const desc = neonText(this, 0, 60, card.desc, 20, CSS.white, { mono: true, wrap: w - 50, glow: 0, lineSpacing: 4 });
        const isNew = choice.stack === 0 && !card.filler;
        const stackStr = card.filler ? 'BONUS' : (isNew ? 'NEW!' : `RANK ${choice.stack} → ${choice.stack + 1}`);
        const stack = neonText(this, 0, h / 2 - 34, stackStr, 18, isNew ? CSS.yellow : CSS.dim, { mono: true, glow: isNew ? 8 : 0 });
        const key = neonText(this, -w / 2 + 24, -h / 2 + 24, String(index + 1), 18, CSS.dim, { mono: true, glow: 0 });
        const frontParts = [g, icon, name, desc, stack, key];
        frontParts.forEach((o) => o.setVisible(false));

        c.add([...backParts, ...frontParts]);
        c.setSize(w, h);
        c.setInteractive({ useHandCursor: true });

        let pressed = false;
        c.on('pointerover', () => { if (!this.ready || this.done) return; draw(true); this.tweens.add({ targets: c, scaleX: 1.05, scaleY: 1.05, duration: 100 }); });
        c.on('pointerout', () => { pressed = false; if (!this.ready || this.done) return; draw(false); this.tweens.add({ targets: c, scaleX: 1, scaleY: 1, duration: 100 }); });
        c.on('pointerdown', () => { pressed = true; });
        c.on('pointerup', () => { if (pressed) { pressed = false; this.pick(index); } });

        // Deal in, then flip: squash scaleX to 0, swap faces, spring back open.
        this.tweens.add({ targets: c, y, alpha: 1, duration: 300, delay: 60 + index * 90, ease: 'Back.easeOut' });
        this.tweens.add({
          targets: c, scaleX: 0, duration: 120, delay: FLIP_START + index * FLIP_STAGGER, ease: 'Quad.easeIn',
          onComplete: () => {
            backParts.forEach((o) => o.setVisible(false));
            frontParts.forEach((o) => o.setVisible(true));
            Sfx.play('flip', 0);
            this.tweens.add({ targets: c, scaleX: 1, duration: 220, ease: 'Back.easeOut' });
            this.tweens.add({ targets: icon, y: -126, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
          },
        });
        return c;
      }

      pick(i) {
        if (!this.ready || this.done || !this.choices[i]) return;
        this.done = true;
        Sfx.play('buy');
        this.gs.applyCard(this.choices[i].id);
        this.cards.forEach((c, j) => {
          this.tweens.killTweensOf(c);
          this.tweens.add(j === i
            ? { targets: c, scaleX: 1.15, scaleY: 1.15, y: c.y - 20, duration: 160, ease: 'Back.easeOut' }
            : { targets: c, alpha: 0, scaleX: 0.85, scaleY: 0.85, y: c.y + 40, duration: 160 });
        });
        this.time.delayedCall(260, () => {
          this.scene.resume('Game');
          this.scene.stop();
        });
      }
    }

    // ------------------------------------------------------------------------------------
    // PAUSE
    // ------------------------------------------------------------------------------------
    class PauseScene extends Phaser.Scene {
      constructor() { super('Pause'); }

      create() {
        this.closing = false;
        addBlocker(this, 0.72);
        neonText(this, W / 2, 190, 'PAUSED', 84, CSS.cyan, { glow: 24 });
        new NeonButton(this, W / 2, 330, 340, 72, 'RESUME', C.cyan, () => this.resumeGame(), 32);
        this.muteBtn = new NeonButton(this, W / 2, 420, 340, 72, '', C.violet, () => this.toggleMute(), 28);
        new NeonButton(this, W / 2, 510, 340, 72, 'MAIN MENU', C.magenta, () => this.toMenu(), 32);
        this.refreshMute();
        if (this.input.keyboard) {
          this.input.keyboard.on('keydown-ESC', () => this.resumeGame());
          this.input.keyboard.on('keydown-P', () => this.resumeGame());
        }
      }

      toggleMute() { Save.data.muted = !Save.data.muted; Save.persist(); this.refreshMute(); }
      refreshMute() { this.muteBtn.setText(Save.data.muted ? 'SOUND: OFF' : 'SOUND: ON'); }

      resumeGame() {
        if (this.closing) return;
        this.closing = true;
        this.scene.resume('Game');
        this.scene.stop();
      }

      toMenu() {
        if (this.closing) return;
        this.closing = true;
        this.scene.stop('Game'); // Game's shutdown handler also stops the HUD
        this.scene.start('Menu');
      }
    }

    // ------------------------------------------------------------------------------------
    // GAME OVER
    // ------------------------------------------------------------------------------------
    class GameOverScene extends Phaser.Scene {
      constructor() { super('GameOver'); }

      init(data) { this.summary = data || { time: 0, kills: 0, coins: 0, level: 1, newBest: false }; }

      create() {
        const s = this.summary;
        this.leaving = false;
        this.cameras.main.fadeIn(300, 5, 7, 13);
        this.add.tileSprite(0, 0, W, H, 'grid').setOrigin(0).setAlpha(0.6);
        this.add.rectangle(0, 0, W, H, C.ink, 0.45).setOrigin(0);
        this.add.image(W / 2, H / 2, 'vignette_dark').setDisplaySize(W, H);

        const title = neonText(this, W / 2, 110, 'YOU GOT ERASED', 80, CSS.magenta, { glow: 26 }).setAngle(-2);
        this.tweens.add({ targets: title, angle: 2, duration: 1400, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

        const g = this.add.graphics();
        g.fillStyle(C.ink, 0.9); g.fillRoundedRect(W / 2 - 300, 190, 600, 290, 18);
        g.lineStyle(8, C.cyan, 0.1); g.strokeRoundedRect(W / 2 - 300, 190, 600, 290, 18);
        g.lineStyle(2, C.cyan, 0.8); g.strokeRoundedRect(W / 2 - 300, 190, 600, 290, 18);

        const rows = [
          ['RUN TIME', fmtTime(s.time), CSS.white],
          ['TOTAL KILLS', String(s.kills), CSS.white],
          ['LEVEL REACHED', String(s.level), CSS.cyan],
          ['BEST COMBO', 'x' + (s.bestCombo || 0), CSS.magenta],
          ['COINS COLLECTED', '+' + s.coins, CSS.yellow],
        ];
        rows.forEach(([label, val, col], i) => {
          const y = 236 + i * 52;
          neonText(this, W / 2 - 250, y, label, 24, CSS.dim, { mono: true, ox: 0, glow: 0 });
          const v = neonText(this, W / 2 + 250, y, val, 34, col, { mono: true, ox: 1, glow: 10 }).setAlpha(0);
          this.tweens.add({ targets: v, alpha: 1, x: { from: W / 2 + 290, to: W / 2 + 250 }, delay: 200 + i * 140, duration: 260 });
        });
        if (s.newBest) {
          const nb = neonText(this, W / 2 + 230, 196, 'NEW BEST!', 26, CSS.yellow, { glow: 14 }).setAngle(8);
          this.tweens.add({ targets: nb, scale: 1.12, duration: 500, yoyo: true, repeat: -1 });
        }
        neonText(this, W / 2, 506, `WALLET: ${Save.data.coins} COINS — SPEND THEM IN THE SHOP`, 18, CSS.dim, { mono: true, glow: 0 });

        const retry = new NeonButton(this, W / 2 - 190, 600, 340, 76, 'RETRY', C.cyan, () => this.go('Game'), 34);
        const menu = new NeonButton(this, W / 2 + 190, 600, 340, 76, 'MAIN MENU', C.magenta, () => this.go('Menu'), 34);
        // Guard against the tail end of a frantic touch landing on a button.
        retry.disableInteractive(); menu.disableInteractive();
        this.ready = false;
        this.time.delayedCall(500, () => { this.ready = true; retry.setInteractive({ useHandCursor: true }); menu.setInteractive({ useHandCursor: true }); });

        if (this.input.keyboard) {
          this.input.keyboard.on('keydown-R', () => this.go('Game'));
          this.input.keyboard.on('keydown-ENTER', () => this.go('Game'));
          this.input.keyboard.on('keydown-M', () => this.go('Menu'));
          this.input.keyboard.on('keydown-ESC', () => this.go('Menu'));
        }
      }

      go(key) {
        if (this.leaving || !this.ready) return;
        this.leaving = true;
        this.cameras.main.fadeOut(180, 5, 7, 13);
        this.cameras.main.once(Phaser.Cameras.Scene2D.Events.FADE_OUT_COMPLETE, () => this.scene.start(key));
      }
    }

    // ------------------------------------------------------------------------------------
    // Bootstrap: wait briefly for the web fonts so Phaser rasterises text with them.
    // ------------------------------------------------------------------------------------
    Save.load();

    const fontsReady = (document.fonts && document.fonts.load)
      ? Promise.race([
          Promise.all([document.fonts.load('40px "Permanent Marker"'), document.fonts.load('20px "Share Tech Mono"')]),
          new Promise((r) => setTimeout(r, 2500)),
        ]).catch(() => {})
      : Promise.resolve();

    fontsReady.then(() => {
      // eslint-disable-next-line no-new
      new Phaser.Game({
        type: Phaser.AUTO,
        parent: 'game',
        width: W,
        height: H,
        backgroundColor: '#0a0e17',
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        physics: { default: 'arcade', arcade: { debug: false, gravity: { x: 0, y: 0 } } },
        input: { activePointers: 3 },
        render: { antialias: true, powerPreference: 'high-performance' },
        disableContextMenu: true,
        banner: false,
        scene: [BootScene, MenuScene, ShopScene, GameScene, HUDScene, LevelUpScene, PauseScene, GameOverScene],
      });
    });
  })();
  </script>
