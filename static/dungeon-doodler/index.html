<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e17">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Dungeon Doodler: a notebook-cyberpunk rogue-lite bullet-heaven.">
  <title>Dungeon Doodler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root { --cyan: #00ffff; --magenta: #ff0055; --ink: #0a0e17; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--ink);
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background:
        radial-gradient(ellipse at center, rgba(0, 255, 255, 0.05) 0%, rgba(5, 7, 13, 0) 60%),
        var(--ink);
    }
    #game {
      position: fixed; inset: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #game canvas {
      display: block;
      touch-action: none;
      outline: none;
      box-shadow: 0 0 40px rgba(0, 243, 255, 0.12), 0 0 0 1px rgba(0, 243, 255, 0.15);
    }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--cyan); font: 22px "Share Tech Mono", "Courier New", monospace;
      letter-spacing: 0.2em; text-shadow: 0 0 10px var(--cyan); pointer-events: none;
    }
    #rotate {
      display: none; position: fixed; left: 0; right: 0; top: 0;
      padding: 8px 12px; text-align: center; pointer-events: none;
      font: 14px "Share Tech Mono", "Courier New", monospace; color: var(--magenta);
      text-shadow: 0 0 8px var(--magenta); background: rgba(5, 7, 13, 0.7); z-index: 5;
    }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: block; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="boot">SHARPENING PENCILS…</div>
  <div id="rotate">↻ Rotate your device to landscape for the best experience</div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script>
  /**
   * DUNGEON DOODLER
   * A notebook-cyberpunk rogue-lite bullet-heaven built on Phaser 3 (Arcade Physics).
   *
   * Everything lives inside this IIFE so nothing leaks onto `window` (Phaser itself is the
   * only global, provided by the CDN script above).
   *
   * Scene graph:
   *   Boot      -> procedurally bakes every texture (no external art assets), then opens Menu.
   *   Menu      -> title, PLAY GAME, SHOP, sound toggle, best run.
   *   Shop      -> meta-progression purchases persisted in localStorage (`dungeonDoodler_save`).
   *   Game      -> the run itself: arena, player, enemies, pooled projectiles/pickups, director.
   *   HUD       -> runs in parallel above Game; health, XP, level, timer, coins, pause.
   *   LevelUp   -> draft-card overlay; Game is paused underneath with `scene.pause()`.
   *   Pause     -> pause overlay.
   *   GameOver  -> run summary with RETRY / MAIN MENU.
   */
  (() => {
    'use strict';

    const bootEl = document.getElementById('boot');
    if (typeof Phaser === 'undefined') {
      bootEl.textContent = 'COULD NOT LOAD PHASER — CHECK YOUR CONNECTION AND REFRESH';
      return;
    }

    // ------------------------------------------------------------------------------------
    // Constants
    // ------------------------------------------------------------------------------------
    const W = 1280;
    const H = 720;
    const TAU = Math.PI * 2;

    /** Arena size in world pixels; `wall` is the thickness of the charcoal border. */
    const ARENA = { w: 2400, h: 1600, wall: 56 };

    // Palette ("Glowing Neon Sketchbook"):
    //   player = electric cyan, enemies = neon crimson / hot orange, XP + coins = neon gold.
    const C = {
      cyan: 0x00ffff,
      crimson: 0xff2233,
      orange: 0xff7a1a,
      ember: 0xff3d5e, // blobs: a pinker crimson so the three enemy types stay distinct
      magenta: 0xff0055, // UI accent (crits, shop, menus)
      yellow: 0xffd700, // neon gold
      violet: 0xc03bff,
      green: 0x5dff9d,
      white: 0xffffff,
      ink: 0x05080f,
      paper: 0x0a0e17,
      charcoal: 0x0d121d,
      graphite: 0x8a909c,
    };
    const hex = (c) => '#' + c.toString(16).padStart(6, '0');
    const CSS = {
      crimson: hex(C.crimson),
      cyan: hex(C.cyan), magenta: hex(C.magenta), yellow: hex(C.yellow), green: hex(C.green),
      violet: hex(C.violet), white: '#e8f6ff', dim: '#6b7d99', ink: '#05070d',
    };

    const FONT_HEAD = '"Permanent Marker", "Comic Sans MS", "Marker Felt", cursive';
    const FONT_MONO = '"Share Tech Mono", "Courier New", monospace';

    const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;

    const MAX_ENEMIES = 220;
    const MAX_BULLETS = 400;
    const MAX_GEMS = 300;
    const MAX_COINS = 120;
    const WAVE_LENGTH = 30; // seconds between difficulty steps
    const COMBO_WINDOW = 2.2; // seconds a combo survives without a kill
    const COMBO_MILESTONES = [10, 25, 50, 75, 100, 150, 200, 300, 500];
    /** Attack-speed multiplier granted by the current combo (caps at +30%). */
    const comboAtkBonus = (combo) => Math.min(combo, 60) * 0.005;
    const FLIP_START = 420; // ms before the first draft card flips face-up
    const FLIP_STAGGER = 150; // ms between card flips

    // ------------------------------------------------------------------------------------
    // Small helpers
    // ------------------------------------------------------------------------------------
    const rand = (a, b) => a + Math.random() * (b - a);
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const fmtTime = (sec) => {
      const s = Math.max(0, Math.floor(sec));
      return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    };
    /** XP required to go from level `l` to `l + 1`. */
    const xpForLevel = (l) => Math.round(4 + l * 3 + Math.pow(l, 1.6));

    /** Neon-styled text factory. */
    function neonText(scene, x, y, str, size, color, opts = {}) {
      const t = scene.add.text(x, y, str, {
        fontFamily: opts.mono ? FONT_MONO : FONT_HEAD,
        fontSize: size + 'px',
        color,
        align: opts.align || 'center',
        stroke: CSS.ink,
        strokeThickness: opts.strokeThickness !== undefined ? opts.strokeThickness : Math.max(3, Math.round(size / 9)),
        wordWrap: opts.wrap ? { width: opts.wrap, useAdvancedWrap: true } : undefined,
        lineSpacing: opts.lineSpacing || 0,
        // Room for the glow so the shadow blur isn't clipped into a visible box.
        padding: { x: opts.glow === 0 ? 2 : (opts.glow || 12) + 4, y: opts.glow === 0 ? 2 : (opts.glow || 12) + 4 },
      });
      t.setOrigin(opts.ox !== undefined ? opts.ox : 0.5, opts.oy !== undefined ? opts.oy : 0.5);
      if (opts.glow !== 0) t.setShadow(0, 0, color, opts.glow || 12, true, true);
      return t;
    }

    // ------------------------------------------------------------------------------------
    // Save system (localStorage, defensive against corrupt data / disabled storage)
    // ------------------------------------------------------------------------------------
    const SAVE_KEY = 'dungeonDoodler_save';
    const defaultSave = () => ({
      version: 1,
      coins: 0,
      upgrades: { maxHp: 0, damage: 0, crit: 0 },
      best: { time: 0, kills: 0, level: 1 },
      runs: 0,
      muted: false,
    });
    const safeInt = (v, min = 0, max = 1e9) => {
      const n = Math.floor(Number(v));
      return Number.isFinite(n) ? clamp(n, min, max) : min;
    };

    const Save = {
      data: defaultSave(),
      dirty: false,
      load() {
        const d = defaultSave();
        try {
          const raw = window.localStorage.getItem(SAVE_KEY);
          if (raw) {
            const p = JSON.parse(raw) || {};
            d.coins = safeInt(p.coins);
            d.runs = safeInt(p.runs);
            d.muted = !!p.muted;
            const u = p.upgrades || {};
            for (const item of SHOP_ITEMS) d.upgrades[item.id] = safeInt(u[item.id], 0, item.max);
            const b = p.best || {};
            d.best.time = safeInt(b.time);
            d.best.kills = safeInt(b.kills);
            d.best.level = safeInt(b.level, 1);
          }
        } catch (e) { /* corrupt or blocked storage -> fresh profile */ }
        this.data = d;
        return d;
      },
      persist() {
        this.dirty = false;
        try { window.localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* storage full / private mode */ }
      },
    };

    // ------------------------------------------------------------------------------------
    // Meta-shop catalogue
    // ------------------------------------------------------------------------------------
    const SHOP_ITEMS = [
      { id: 'maxHp', name: 'MAX HP UP', desc: '+20 starting max health per level', icon: 'ic_heart', color: C.magenta, base: 20, growth: 1.55, max: 10 },
      { id: 'damage', name: 'DAMAGE UP', desc: '+15% base damage per level', icon: 'ic_sharp', color: C.cyan, base: 30, growth: 1.6, max: 10 },
      { id: 'crit', name: 'CRIT CHANCE UP', desc: '+4% critical hit chance per level', icon: 'ic_focus', color: C.yellow, base: 40, growth: 1.65, max: 10 },
    ];
    const shopPrice = (item, lvl) => Math.round(item.base * Math.pow(item.growth, lvl));

    // ------------------------------------------------------------------------------------
    // Level-up draft card pool
    // ------------------------------------------------------------------------------------
    const CARDS = [
      { id: 'bouncy', name: 'BOUNCY SHOTS', desc: 'Projectiles ricochet off the arena walls up to 2 more times.', icon: 'ic_bouncy', color: C.cyan, max: 3,
        apply: (s) => { s.bounces += 2; } },
      { id: 'triple', name: 'TRIPLE SHOT', desc: 'Fire +2 additional parallel projectiles every volley.', icon: 'ic_triple', color: C.magenta, max: 3,
        apply: (s) => { s.extraShots += 2; } },
      { id: 'speed', name: 'SPEED BOOST', desc: 'Permanently +15% movement speed for this run.', icon: 'ic_speed', color: C.green, max: 5,
        apply: (s) => { s.speed *= 1.15; } },
      { id: 'vampire', name: 'VAMPIRIC TOUCH', desc: 'Restore 10% max HP on every 10th kill.', icon: 'ic_vampire', color: C.magenta, max: 1,
        apply: (s) => { s.vampiric = true; } },
      { id: 'rapid', name: 'RAPID SCRIBBLE', desc: 'Attack cooldown reduced by 15%.', icon: 'ic_rapid', color: C.yellow, max: 5,
        apply: (s) => { s.attackCooldown = Math.max(0.12, s.attackCooldown * 0.85); } },
      { id: 'sharp', name: 'SHARPENED LEAD', desc: '+25% projectile damage.', icon: 'ic_sharp', color: C.cyan, max: 6,
        apply: (s) => { s.damage *= 1.25; } },
      { id: 'paper', name: 'THICK PAPER', desc: '+25 max HP and fully restore health.', icon: 'ic_heart', color: C.magenta, max: 5,
        apply: (s) => { s.maxHealth += 25; s.currentHealth = s.maxHealth; } },
      { id: 'magnet', name: 'GEM MAGNET', desc: '+50% pickup radius for XP gems and coins.', icon: 'ic_magnet', color: C.violet, max: 3,
        apply: (s) => { s.pickupRadius *= 1.5; } },
      { id: 'focus', name: 'LASER FOCUS', desc: '+8% crit chance and +20% targeting range.', icon: 'ic_focus', color: C.yellow, max: 4,
        apply: (s) => { s.critChance = Math.min(0.9, s.critChance + 0.08); s.range *= 1.2; } },
    ];
    /** Shown only when the pool cannot fill a full hand (everything maxed). */
    const FILLER_CARD = { id: 'coffee', name: 'COFFEE BREAK', desc: 'Restore 40% max HP.', icon: 'ic_heart', color: C.green, max: Infinity, filler: true,
      apply: (s) => { s.currentHealth = Math.min(s.maxHealth, s.currentHealth + s.maxHealth * 0.4); } };
    const CARD_BY_ID = Object.fromEntries([...CARDS, FILLER_CARD].map((c) => [c.id, c]));

    // ------------------------------------------------------------------------------------
    // Enemy archetypes
    // ------------------------------------------------------------------------------------
    const ENEMY_TYPES = {
      // Floats straight at the player and ignores internal pillars.
      ghost: { tex: 'ghost', hp: 16, speed: 82, dmg: 8, radius: 15, xp: 1, coin: 0.22, phasing: true, color: C.crimson },
      // Fast, fragile.
      goblin: { tex: 'goblin', hp: 9, speed: 168, dmg: 6, radius: 14, xp: 1, coin: 0.18, phasing: false, color: C.orange },
      // Slow, tanky.
      blob: { tex: 'blob', hp: 70, speed: 48, dmg: 14, radius: 21, xp: 3, coin: 0.45, phasing: false, color: C.ember },
    };

    // ------------------------------------------------------------------------------------
    // Procedural audio (WebAudio, no assets). Silently no-ops when unavailable.
    // ------------------------------------------------------------------------------------
    const Sfx = (() => {
      let ctx = null;
      let master = null;
      const last = Object.create(null);

      function ensure() {
        if (ctx) return ctx;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        try {
          ctx = new AC();
          master = ctx.createGain();
          master.gain.value = 0.22;
          master.connect(ctx.destination);
        } catch (e) { ctx = null; }
        return ctx;
      }

      function tone(freq, dur, type, vol, slideTo) {
        const t0 = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t0);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
        gain.gain.setValueAtTime(vol, t0);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain);
        gain.connect(master);
        osc.start(t0);
        osc.stop(t0 + dur + 0.02);
        osc.onended = () => { osc.disconnect(); gain.disconnect(); };
      }

      const presets = {
        shoot: () => tone(920, 0.06, 'square', 0.05, 520),
        hit: () => tone(240, 0.05, 'triangle', 0.12, 120),
        crit: () => tone(1400, 0.08, 'sawtooth', 0.08, 700),
        kill: () => tone(520, 0.12, 'triangle', 0.14, 90),
        gem: () => tone(1200 + Math.random() * 300, 0.06, 'sine', 0.12, 1800),
        coin: () => { tone(1320, 0.06, 'square', 0.07); setTimeout(() => ctx && tone(1760, 0.08, 'square', 0.07), 55); },
        hurt: () => tone(160, 0.22, 'sawtooth', 0.22, 60),
        level: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => ctx && tone(f, 0.16, 'triangle', 0.16), i * 70)),
        click: () => tone(660, 0.05, 'square', 0.08, 880),
        buy: () => [784, 1046, 1318].forEach((f, i) => setTimeout(() => ctx && tone(f, 0.1, 'square', 0.09), i * 60)),
        deny: () => tone(180, 0.15, 'square', 0.1, 140),
        flip: () => tone(500, 0.07, 'triangle', 0.1, 1100),
        combo: () => [880, 1175, 1568, 2093].forEach((f, i) => setTimeout(() => ctx && tone(f, 0.09, 'square', 0.08), i * 45)),
        slowmo: () => tone(900, 0.6, 'sine', 0.18, 90),
        die: () => tone(400, 0.9, 'sawtooth', 0.25, 40),
        wave: () => tone(220, 0.5, 'sawtooth', 0.12, 660),
      };

      return {
        unlock() {
          const c = ensure();
          if (c && c.state === 'suspended') c.resume().catch(() => {});
        },
        play(name, minGap = 0.03) {
          if (Save.data.muted) return;
          const c = ensure();
          if (!c || c.state !== 'running' || !presets[name]) return;
          const now = c.currentTime;
          if (last[name] !== undefined && now - last[name] < minGap) return;
          last[name] = now;
          try { presets[name](); } catch (e) { /* ignore audio glitches */ }
        },
      };
    })();
    // Browsers require a user gesture before audio can start.
    ['pointerdown', 'keydown', 'touchstart'].forEach((ev) => window.addEventListener(ev, () => Sfx.unlock(), { passive: true }));

    // ------------------------------------------------------------------------------------
    // Reusable neon button (Container with a centred hit area)
    //   - Fires on pointerup only if the press began on the button: no ghost clicks from a
    //     joystick release or a double-fired touch.
    // ------------------------------------------------------------------------------------
    class NeonButton extends Phaser.GameObjects.Container {
      constructor(scene, x, y, w, h, label, color, onClick, size = 30) {
        super(scene, x, y);
        this.w = w; this.h = h; this.color = color; this.onClick = onClick;
        this.enabled = true; this.hover = false; this.pressed = false;
        this.gfx = scene.add.graphics();
        this.label = neonText(scene, 0, 0, label, size, hex(color), { glow: 10 });
        this.add([this.gfx, this.label]);
        this.setSize(w, h);
        this.setInteractive({ useHandCursor: true });
        this.on('pointerover', () => { this.hover = true; this.redraw(); this.tweenScale(1.05); });
        this.on('pointerout', () => { this.hover = false; this.pressed = false; this.redraw(); this.tweenScale(1); });
        this.on('pointerdown', () => { if (this.enabled) { this.pressed = true; this.setScale(0.95); } });
        this.on('pointerup', () => {
          if (!this.pressed) return;
          this.pressed = false;
          this.setScale(this.hover ? 1.05 : 1);
          if (!this.enabled) return;
          Sfx.play('click');
          this.onClick();
        });
        this.redraw();
        scene.add.existing(this);
      }
      tweenScale(s) {
        if (!this.enabled) return;
        this.scene.tweens.killTweensOf(this);
        this.scene.tweens.add({ targets: this, scale: s, duration: 90, ease: 'Quad.easeOut' });
      }
      redraw() {
        const g = this.gfx, w = this.w, h = this.h, c = this.color;
        const a = this.enabled ? 1 : 0.35;
        const r = Math.min(18, h / 2);
        g.clear();
        g.fillStyle(c, (this.hover && this.enabled ? 0.14 : 0.06) * a); g.fillRoundedRect(-w / 2 - 6, -h / 2 - 6, w + 12, h + 12, r + 6);
        g.fillStyle(C.ink, 0.92); g.fillRoundedRect(-w / 2, -h / 2, w, h, r);
        g.fillStyle(c, (this.hover && this.enabled ? 0.24 : 0.1) * a); g.fillRoundedRect(-w / 2, -h / 2, w, h, r);
        // Glossy top highlight.
        g.fillStyle(0xffffff, 0.06 * a); g.fillRoundedRect(-w / 2 + 8, -h / 2 + 5, w - 16, h * 0.32, Math.min(10, h * 0.16));
        g.lineStyle(12, c, 0.1 * a); g.strokeRoundedRect(-w / 2, -h / 2, w, h, r);
        g.lineStyle(6, c, 0.22 * a); g.strokeRoundedRect(-w / 2, -h / 2, w, h, r);
        g.lineStyle(3.5, c, a); g.strokeRoundedRect(-w / 2, -h / 2, w, h, r);
        this.label.setAlpha(a);
      }
      setEnabled(v) { this.enabled = v; this.redraw(); return this; }
      setText(s) { this.label.setText(s); return this; }
    }

    /** Translucent full-screen rectangle that also swallows pointer input for the scenes below. */
    function addBlocker(scene, alpha) {
      return scene.add.rectangle(0, 0, W, H, C.ink, alpha).setOrigin(0).setInteractive();
    }

    // ------------------------------------------------------------------------------------
    // BOOT: bake all textures procedurally
    // ------------------------------------------------------------------------------------
    /** Draws a stroke several times with decreasing width/alpha to fake a neon bloom. */
    function neon(g, color, width, draw, core = true) {
      const passes = [[width + 12, 0.05], [width + 7, 0.1], [width + 3, 0.25], [width, 1]];
      for (const [w, a] of passes) { g.lineStyle(w, color, a); draw(g); }
      if (core) { g.lineStyle(Math.max(1, width * 0.35), 0xffffff, 0.75); draw(g); }
    }
    const pts = (arr) => arr.map(([x, y]) => new Phaser.Math.Vector2(x, y));

    /**
     * Marker-pen stroke: a neon stroke plus a slightly offset, thinner second pass, like a
     * felt-tip line that was traced twice by hand.
     */
    function marker(g, color, width, draw) {
      neon(g, color, width, draw);
      g.save();
      g.translateCanvas(1.3, -1);
      g.lineStyle(width * 0.55, color, 0.55); draw(g);
      g.restore();
    }

    /** Sketchy, slightly wobbly rectangle outline like a charcoal pencil. */
    function sketchRect(g, x, y, w, h, jitter, step = 14) {
      const edge = (x1, y1, x2, y2) => {
        const len = Math.hypot(x2 - x1, y2 - y1);
        const n = Math.max(2, Math.round(len / step));
        g.beginPath();
        g.moveTo(x1 + rand(-jitter, jitter), y1 + rand(-jitter, jitter));
        for (let i = 1; i <= n; i++) {
          const t = i / n;
          g.lineTo(x1 + (x2 - x1) * t + rand(-jitter, jitter), y1 + (y2 - y1) * t + rand(-jitter, jitter));
        }
        g.strokePath();
      };
      edge(x, y, x + w, y); edge(x + w, y, x + w, y + h); edge(x + w, y + h, x, y + h); edge(x, y + h, x, y);
    }

    /** Charcoal hatching inside a rectangle. */
    function hatch(g, x, y, w, h, count, color, alpha) {
      for (let i = 0; i < count; i++) {
        const x1 = rand(x, x + w), y1 = rand(y, y + h), d = rand(5, 16);
        g.lineStyle(rand(1, 2.2), color, alpha * rand(0.4, 1));
        g.lineBetween(x1, y1, Math.min(x + w, x1 + d), Math.max(y, y1 - d));
      }
    }

    class BootScene extends Phaser.Scene {
      constructor() { super('Boot'); }

      create() {
        const g = this.make.graphics({ x: 0, y: 0 }, false);
        const bake = (key, w, h, fn) => {
          g.clear();
          fn(g, w, h);
          g.generateTexture(key, w, h);
        };

        // ---- Player: electric-cyan doodle with a white-hot core and a scribble crown ----
        bake('player', 64, 64, (g) => {
          g.fillStyle(C.cyan, 0.22); g.fillCircle(32, 33, 17);
          g.fillStyle(0xffffff, 0.14); g.fillCircle(32, 33, 13);
          g.fillStyle(0xffffff, 0.16); g.fillCircle(32, 33, 8);
          marker(g, C.cyan, 3.5, (g) => g.strokeCircle(32, 33, 17));
          g.fillStyle(0xffffff, 1); g.fillCircle(26, 30, 3.8); g.fillCircle(38, 30, 3.8);
          g.fillStyle(C.ink, 1); g.fillCircle(27, 30.5, 1.8); g.fillCircle(39, 30.5, 1.8);
          neon(g, C.cyan, 2, (g) => { g.beginPath(); g.arc(32, 35, 6, 0.15 * Math.PI, 0.85 * Math.PI, false); g.strokePath(); });
          neon(g, C.cyan, 2.5, (g) => g.strokePoints(pts([[23, 18], [27, 10], [31, 16], [35, 9], [39, 16], [42, 11]]), false));
        });
        // Soft bloom halo drawn behind the player.
        bake('halo', 96, 96, (g) => {
          for (let r = 46; r > 4; r -= 3) { g.fillStyle(0xffffff, 0.022); g.fillCircle(48, 48, r); }
        });

        // ---- Grumpy Ghost (neon crimson) ----
        const ghostPath = (g) => {
          g.beginPath();
          g.moveTo(17, 30);
          g.arc(32, 30, 15, Math.PI, TAU, false);
          g.lineTo(47, 47); g.lineTo(42, 42); g.lineTo(37, 47); g.lineTo(32, 42);
          g.lineTo(27, 47); g.lineTo(22, 42); g.lineTo(17, 47);
          g.closePath();
        };
        bake('ghost', 64, 64, (g) => {
          g.fillStyle(C.crimson, 0.22); ghostPath(g); g.fillPath();
          marker(g, C.crimson, 3.5, (g) => { ghostPath(g); g.strokePath(); });
          g.fillStyle(0xffffff, 1); g.fillCircle(26, 31, 3.2); g.fillCircle(38, 31, 3.2);
          g.lineStyle(3, 0xffffff, 1);
          g.lineBetween(21, 23, 29, 27); g.lineBetween(43, 23, 35, 27);
          g.strokePoints(pts([[27, 38], [30, 36], [33, 38], [36, 36]]), false);
        });

        // ---- Fast Goblin (hot orange) ----
        const goblinPts = pts([[32, 14], [39, 22], [55, 15], [46, 31], [44, 44], [32, 51], [20, 44], [18, 31], [9, 15], [25, 22]]);
        bake('goblin', 64, 64, (g) => {
          g.fillStyle(C.orange, 0.22); g.fillPoints(goblinPts, true);
          marker(g, C.orange, 3, (g) => g.strokePoints(goblinPts, true, true));
          g.fillStyle(0xffffff, 1);
          g.fillTriangle(23, 30, 30, 33, 23, 34); g.fillTriangle(41, 30, 34, 33, 41, 34);
          g.lineStyle(2.5, 0xffffff, 1);
          g.strokePoints(pts([[25, 41], [28, 44], [31, 41], [34, 44], [37, 41], [40, 44]]), false);
        });

        // ---- Blob Monster (ember crimson) ----
        const blobPts = [];
        for (let i = 0; i < 18; i++) {
          const a = (i / 18) * TAU;
          const r = 21 + Math.sin(i * 2.7) * 1.8 + (Math.sin(a) > 0.6 ? 1.5 : 0);
          blobPts.push(new Phaser.Math.Vector2(32 + Math.cos(a) * r, 33 + Math.sin(a) * r * 0.92));
        }
        bake('blob', 64, 64, (g) => {
          g.fillStyle(C.ember, 0.26); g.fillPoints(blobPts, true);
          marker(g, C.ember, 3.5, (g) => g.strokePoints(blobPts, true, true));
          g.fillStyle(0xffffff, 1); g.fillCircle(25, 29, 5); g.fillCircle(40, 30, 3.5);
          g.fillStyle(C.ink, 1); g.fillCircle(26, 30, 2.4); g.fillCircle(40.5, 31, 1.8);
          g.lineStyle(3, 0xffffff, 0.9); g.lineBetween(26, 41, 39, 40);
        });

        // ---- Projectile ----
        bake('bullet', 24, 24, (g) => {
          g.fillStyle(C.cyan, 0.12); g.fillCircle(12, 12, 11);
          g.fillStyle(C.cyan, 0.3); g.fillCircle(12, 12, 8);
          g.fillStyle(C.cyan, 1); g.fillCircle(12, 12, 5.5);
          g.fillStyle(0xffffff, 1); g.fillCircle(12, 12, 2.8);
        });

        // ---- Pickups ----
        const gem = (key, color, s) => bake(key, 32, 32, (g) => {
          const d = pts([[16, 16 - 9 * s], [16 + 7 * s, 16], [16, 16 + 9 * s], [16 - 7 * s, 16]]);
          g.fillStyle(color, 0.35); g.fillPoints(d, true);
          neon(g, color, 2, (g) => g.strokePoints(d, true, true));
        });
        gem('gem', C.yellow, 0.8);
        gem('gem_big', C.yellow, 1.2);
        // Shockwave ring used for kills, combo milestones and level-ups.
        bake('ring', 128, 128, (g) => neon(g, 0xffffff, 3, (g) => g.strokeCircle(64, 64, 54), false));
        bake('coin', 32, 32, (g) => {
          g.fillStyle(C.yellow, 0.3); g.fillCircle(16, 16, 8);
          neon(g, C.yellow, 2, (g) => g.strokeCircle(16, 16, 8));
          g.lineStyle(2, 0xffffff, 0.9); g.lineBetween(16, 12, 16, 20);
        });

        // ---- FX ----
        bake('spark', 16, 16, (g) => {
          g.fillStyle(0xffffff, 0.25); g.fillCircle(8, 8, 7);
          g.fillStyle(0xffffff, 0.6); g.fillCircle(8, 8, 4.5);
          g.fillStyle(0xffffff, 1); g.fillCircle(8, 8, 2.5);
        });
        bake('aim', 32, 32, (g) => neon(g, C.cyan, 2.5, (g) => g.strokePoints(pts([[11, 8], [22, 16], [11, 24]]), false), false));
        bake('joy_base', 170, 170, (g) => {
          g.fillStyle(C.cyan, 0.07); g.fillCircle(85, 85, 72);
          neon(g, C.cyan, 2.5, (g) => g.strokeCircle(85, 85, 72), false);
        });
        bake('joy_knob', 80, 80, (g) => {
          g.fillStyle(C.cyan, 0.3); g.fillCircle(40, 40, 28);
          neon(g, C.cyan, 3, (g) => g.strokeCircle(40, 40, 28));
        });

        // ---- Blueprint graph paper (tileable): hand-drawn white lines on deep ink ----
        // Lines wobble in the middle but meet the tile edges exactly, so the tiling stays seamless.
        const wobble = (g, x1, y1, x2, y2, amp) => {
          const n = 8;
          g.beginPath(); g.moveTo(x1, y1);
          for (let i = 1; i < n; i++) {
            const t = i / n;
            g.lineTo(x1 + (x2 - x1) * t + (x1 === x2 ? rand(-amp, amp) : 0), y1 + (y2 - y1) * t + (y1 === y2 ? rand(-amp, amp) : 0));
          }
          g.lineTo(x2, y2); g.strokePath();
        };
        bake('grid', 128, 128, (g) => {
          g.fillStyle(C.paper, 1); g.fillRect(0, 0, 128, 128);
          for (let i = 0; i < 80; i++) { g.fillStyle(0xffffff, rand(0.01, 0.03)); g.fillRect(rand(0, 128), rand(0, 128), 1.5, 1.5); }
          g.lineStyle(1, 0xffffff, 0.055);
          for (let v = 32; v < 128; v += 32) { wobble(g, v, 0, v, 128, 0.7); wobble(g, 0, v, 128, v, 0.7); }
          g.lineStyle(1.6, 0xffffff, 0.11);
          wobble(g, 1, 0, 1, 128, 0.5); wobble(g, 0, 1, 128, 1, 0.5);
        });
        // Additive layer of only the major lines; its alpha pulses in-game ("living paper").
        bake('grid_major', 128, 128, (g) => {
          g.lineStyle(2, 0xffffff, 0.9);
          g.lineBetween(1, 0, 1, 128); g.lineBetween(0, 1, 128, 1);
        });

        // ---- Walls: dense white-marker hatching on near-black ink (tileable strips) ----
        const wall = (key, w, h) => bake(key, w, h, (g) => {
          g.fillStyle(C.charcoal, 1); g.fillRect(0, 0, w, h);
          hatch(g, 0, 0, w, h, Math.round((w * h) / 60), 0x3a4558, 0.7);
          hatch(g, 0, 0, w, h, Math.round((w * h) / 220), 0xffffff, 0.22);
        });
        wall('wall_h', 128, ARENA.wall);
        wall('wall_v', ARENA.wall, 128);

        // ---- Pillars (internal obstacles): sketched blocks with a crimson warning X ----
        bake('pillar', 100, 100, (g) => {
          g.fillStyle(0x0b111c, 1); g.fillRect(6, 6, 88, 88);
          hatch(g, 8, 8, 84, 84, 150, 0x3a4558, 0.7);
          hatch(g, 8, 8, 84, 84, 30, 0xffffff, 0.18);
          g.lineStyle(3, 0xffffff, 0.75); sketchRect(g, 6, 6, 88, 88, 1.6);
          g.lineStyle(1.5, 0xffffff, 0.35); sketchRect(g, 7, 7, 86, 86, 2.4);
          marker(g, C.crimson, 2.5, (g) => { g.lineBetween(32, 32, 68, 68); g.lineBetween(68, 32, 32, 68); });
        });

        // ---- Icons for cards and shop ----
        const icon = (key, color, draw) => bake(key, 56, 56, (g) => neon(g, color, 3, draw));
        icon('ic_bouncy', C.cyan, (g) => g.strokePoints(pts([[8, 44], [20, 14], [32, 40], [44, 12], [50, 22]]), false));
        icon('ic_triple', C.magenta, (g) => { g.lineBetween(10, 16, 40, 16); g.lineBetween(10, 28, 46, 28); g.lineBetween(10, 40, 40, 40); g.strokePoints(pts([[38, 21], [47, 28], [38, 35]]), false); });
        icon('ic_speed', C.green, (g) => { g.strokePoints(pts([[12, 14], [26, 28], [12, 42]]), false); g.strokePoints(pts([[28, 14], [42, 28], [28, 42]]), false); });
        icon('ic_vampire', C.magenta, (g) => { g.beginPath(); g.moveTo(28, 8); g.lineTo(40, 30); g.arc(28, 34, 12.5, -0.3, Math.PI + 0.3, false); g.closePath(); g.strokePath(); });
        icon('ic_rapid', C.yellow, (g) => g.strokePoints(pts([[32, 6], [16, 30], [28, 30], [22, 50], [42, 22], [30, 22], [34, 6]]), true, true));
        icon('ic_sharp', C.cyan, (g) => { g.strokePoints(pts([[10, 46], [16, 34], [40, 10], [46, 16], [22, 40]]), true, true); g.lineBetween(16, 34, 22, 40); });
        icon('ic_heart', C.magenta, (g) => { g.beginPath(); g.moveTo(28, 46); g.lineTo(10, 26); g.arc(19, 21, 9.5, Math.PI * 0.8, TAU, false); g.arc(37, 21, 9.5, Math.PI, Math.PI * 2.2, false); g.lineTo(28, 46); g.closePath(); g.strokePath(); });
        icon('ic_magnet', C.violet, (g) => { g.beginPath(); g.arc(28, 26, 15, Math.PI, TAU, false); g.strokePath(); g.lineBetween(13, 26, 13, 44); g.lineBetween(43, 26, 43, 44); });
        icon('ic_focus', C.yellow, (g) => { g.strokeCircle(28, 28, 14); g.lineBetween(28, 6, 28, 18); g.lineBetween(28, 38, 28, 50); g.lineBetween(6, 28, 18, 28); g.lineBetween(38, 28, 50, 28); });

        g.destroy();

        // ---- Vignettes (canvas radial gradients) ----
        const radial = (key, stops) => {
          const tex = this.textures.createCanvas(key, 256, 144);
          if (!tex) return;
          const ctx = tex.getContext();
          const grad = ctx.createRadialGradient(128, 72, 40, 128, 72, 150);
          stops.forEach(([o, c]) => grad.addColorStop(o, c));
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, 256, 144);
          tex.refresh();
        };
        // Neon-pink damage / low-health flash.
        radial('vignette', [[0, 'rgba(255,0,85,0)'], [0.6, 'rgba(255,0,85,0.15)'], [1, 'rgba(255,0,85,0.85)']]);
        // Permanent heavy dark edge that frames every screen.
        radial('vignette_dark', [[0, 'rgba(0,0,0,0)'], [0.55, 'rgba(0,0,0,0.12)'], [0.85, 'rgba(0,0,0,0.5)'], [1, 'rgba(0,0,0,0.82)']]);

        bootEl.style.display = 'none';
        this.scene.start('Menu');
      }
    }

      buildRow(item, y) {
        const x0 = 160, w = W - 320, h = 108;
        const g = this.add.graphics();
        g.fillStyle(C.ink, 0.85); g.fillRoundedRect(x0, y - h / 2, w, h, 14);
        g.lineStyle(6, item.color, 0.12); g.strokeRoundedRect(x0, y - h / 2, w, h, 14);
        g.lineStyle(2, item.color, 0.8); g.strokeRoundedRect(x0, y - h / 2, w, h, 14);
        this.add.image(x0 + 60, y, item.icon).setScale(1.2);
        neonText(this, x0 + 110, y - 22, item.name, 30, hex(item.color), { ox: 0 });
        neonText(this, x0 + 110, y + 20, item.desc, 18, CSS.white, { mono: true, ox: 0, glow: 0 });
        const pips = this.add.graphics();
        const lvlText = neonText(this, x0 + 600, y - 24, '', 18, CSS.dim, { mono: true, glow: 0 });
        const btn = new NeonButton(this, x0 + w - 120, y, 200, 64, '', C.yellow, () => this.buy(item), 24);
        return { item, y, pips, lvlText, btn, px: x0 + 502 };
      }

      buy(item) {
        const lvl = Save.data.upgrades[item.id];
        if (lvl >= item.max) return;
        const price = shopPrice(item, lvl);
        if (Save.data.coins < price) {
          Sfx.play('deny');
          this.cameras.main.shake(120, 0.004);
          return;
        }
        Save.data.coins -= price;
        Save.data.upgrades[item.id] = lvl + 1;
        Save.persist();
        Sfx.play('buy');
        this.refresh();
      }

      refresh() {
        this.walletText.setText(String(Save.data.coins));
        for (const r of this.rows) {
          const lvl = Save.data.upgrades[r.item.id];
          const maxed = lvl >= r.item.max;
          const price = shopPrice(r.item, lvl);
          r.lvlText.setText(`LEVEL ${lvl} / ${r.item.max}`);
          r.pips.clear();
          for (let i = 0; i < r.item.max; i++) {
            const x = r.px + i * 20, y = r.y + 14;
            if (i < lvl) { r.pips.fillStyle(r.item.color, 1); r.pips.fillRect(x, y, 14, 14); }
            r.pips.lineStyle(1.5, r.item.color, 0.7); r.pips.strokeRect(x, y, 14, 14);
          }
          r.btn.setText(maxed ? 'MAXED' : `BUY  ${price}`);
          r.btn.setEnabled(!maxed && Save.data.coins >= price);
        }
      }

      back() {
        if (this.leaving) return;
        this.leaving = true;
        this.cameras.main.fadeOut(160, 5, 7, 13);
        this.cameras.main.once(Phaser.Cameras.Scene2D.Events.FADE_OUT_COMPLETE, () => this.scene.start('Menu'));
      }
    }
